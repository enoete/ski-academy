<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>SKI Academy</title>
<meta name="description" content="Adiaha's interactive study guides.">
<meta name="theme-color" content="#5B3FD1">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🎒</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Lexend:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#FFF6E5; --paper:#FFFFFF; --ink:#24213B; --muted:#5F5A78; --line:#F0DFC0;
  --grape:#5B3FD1; --sun:#FFC83D; --pink:#FF5C8A; --sea:#1BB5A8; --sky:#3D8BFF;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#15142A; --paper:#211F3D; --ink:#F6F1E4; --muted:#B8B3D4; --line:#38355E;
    --grape:#9F8BFF; --sun:#FFD166; --pink:#FF86A7; --sea:#4FD6C9; --sky:#7FB0FF;
  }
}
:root[data-theme="dark"]{
  --bg:#15142A; --paper:#211F3D; --ink:#F6F1E4; --muted:#B8B3D4; --line:#38355E;
  --grape:#9F8BFF; --sun:#FFD166; --pink:#FF86A7; --sea:#4FD6C9; --sky:#7FB0FF;
}
*,*::before,*::after{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;min-height:100vh;background:var(--bg);color:var(--ink);font-family:Lexend,"Segoe UI",system-ui,sans-serif;font-size:17px;line-height:1.55;
  padding:env(safe-area-inset-top,0) env(safe-area-inset-right,0) env(safe-area-inset-bottom,0) env(safe-area-inset-left,0)}
a{color:inherit}
:focus-visible{outline:3px solid var(--sun);outline-offset:3px;border-radius:12px}
.wrap{max-width:960px;margin:0 auto;padding:0 16px}

/* hero */
header{position:relative;overflow:hidden;background:linear-gradient(135deg,#5B3FD1 0%,#8A3FD1 45%,#FF5C8A 100%);color:#fff;padding:44px 0 64px;border-radius:0 0 36px 36px}
header .wrap{position:relative;z-index:1}
.badge{display:inline-block;background:rgba(255,255,255,.2);border:2px solid rgba(255,255,255,.45);border-radius:999px;padding:4px 14px;font-weight:600;font-size:.85rem}
h1{font-family:Fredoka,Lexend,sans-serif;font-weight:700;font-size:clamp(2.8rem,11vw,5rem);line-height:1;margin:14px 0 10px;letter-spacing:.01em;text-shadow:0 4px 0 rgba(0,0,0,.15)}
h1 .ski{color:var(--sun)}
.welcome{font-size:clamp(1.05rem,3.6vw,1.3rem);max-width:30ch;margin:0}
.bubbles span{position:absolute;border-radius:50%;opacity:.22;animation:float 9s ease-in-out infinite}
.bubbles span:nth-child(1){width:140px;height:140px;background:var(--sun);right:-30px;top:-30px}
.bubbles span:nth-child(2){width:70px;height:70px;background:#fff;right:120px;bottom:10px;animation-delay:-3s}
.bubbles span:nth-child(3){width:46px;height:46px;background:var(--sea);right:40px;bottom:60px;animation-delay:-6s}
@keyframes float{50%{transform:translateY(-14px)}}
@media (prefers-reduced-motion:reduce){.bubbles span,.card{animation:none!important;transition:none!important}}

/* subjects */
main{margin-top:-34px;padding-bottom:40px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:18px}
.card{--c:var(--grape);background:var(--paper);border-radius:26px;border:3px solid var(--line);box-shadow:0 6px 0 var(--line);overflow:hidden;animation:pop .45s ease-out both}
@keyframes pop{from{opacity:0;transform:translateY(12px) scale(.98)}}
.card-head{display:flex;align-items:center;gap:12px;background:var(--c);color:#fff;padding:16px 18px}
.icon{flex:none;width:52px;height:52px;border-radius:16px;background:rgba(255,255,255,.25);display:grid;place-items:center;font-size:1.8rem}
.card h2{font-family:Fredoka,Lexend,sans-serif;font-weight:600;font-size:1.55rem;line-height:1.1;margin:0}
.count{font-size:.85rem;opacity:.95}
.card ul{list-style:none;margin:0;padding:12px}
.guide{display:flex;align-items:center;gap:12px;text-decoration:none;padding:12px 14px;border-radius:18px;min-height:56px;transition:background .15s,transform .15s}
.guide:hover,.guide:focus-visible{background:color-mix(in srgb,var(--c) 14%,transparent);transform:translateX(3px)}
.guide .t{font-weight:600;display:block}
.guide .b{display:block;font-size:.88rem;color:var(--muted)}
.guide .go{margin-left:auto;flex:none;width:36px;height:36px;border-radius:50%;background:var(--c);color:#fff;display:grid;place-items:center;font-weight:700}
.guide.new .t::after{content:"New";margin-left:8px;font-size:.7rem;font-weight:700;vertical-align:2px;background:var(--sun);color:#24213B;border-radius:999px;padding:1px 8px}
.empty{padding:14px 16px;color:var(--muted);font-style:italic}
.msg{background:var(--paper);border:3px dashed var(--line);border-radius:22px;padding:18px;text-align:center}
footer{text-align:center;color:var(--muted);font-size:.85rem;padding:0 16px 32px}
</style>
</head>
<body>

<header>
  <div class="bubbles" aria-hidden="true"><span></span><span></span><span></span></div>
  <div class="wrap">
    <span class="badge">🎒 Study guides</span>
    <h1><span class="ski">SKI</span> Academy</h1>
    <p class="welcome">Hi Adiaha! Pick a subject, tap a guide, and have fun learning.</p>
  </div>
</header>

<main class="wrap">
  <div class="grid" id="subjects" aria-live="polite">
    <p class="msg">Loading your guides…</p>
  </div>
</main>

<footer>Made with love for Adiaha</footer>

<script>
const NEW_DAYS = 14;
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const isNew = d => d && (Date.now() - new Date(d + 'T00:00:00')) / 864e5 <= NEW_DAYS;

function render(data) {
  const root = document.getElementById('subjects');
  const subjects = data.subjects || [];
  if (!subjects.length) { root.innerHTML = '<p class="msg">No guides yet. Check back soon!</p>'; return; }
  root.innerHTML = subjects.map((s, i) => {
    const guides = s.guides || [];
    const items = guides.length
      ? guides.map(g => `
          <li><a class="guide${isNew(g.added) ? ' new' : ''}" href="${esc(s.id)}/${esc(g.file)}">
            <span><span class="t">${esc(g.title)}</span>${g.blurb ? `<span class="b">${esc(g.blurb)}</span>` : ''}</span>
            <span class="go" aria-hidden="true">→</span>
          </a></li>`).join('')
      : '<li class="empty">Guides coming soon!</li>';
    return `
      <section class="card" style="--c:${esc(s.color || '#5B3FD1')};animation-delay:${i * 70}ms">
        <div class="card-head">
          <div class="icon" aria-hidden="true">${esc(s.emoji || '📘')}</div>
          <div><h2>${esc(s.name)}</h2><div class="count">${guides.length} guide${guides.length === 1 ? '' : 's'}</div></div>
        </div>
        <ul>${items}</ul>
      </section>`;
  }).join('');
}

fetch('guides.json', { cache: 'no-cache' })
  .then(r => { if (!r.ok) throw new Error(r.status); return r.json(); })
  .then(render)
  .catch(() => {
    document.getElementById('subjects').innerHTML =
      '<p class="msg">Oops, the guide list didn’t load. Try refreshing the page.</p>';
  });
</script>
</body>
</html>
