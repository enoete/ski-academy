<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>The Great Word Game</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&family=Fredoka:wght@500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#FFF9F0; --card:#FFFFFF; --ink:#2A1F3D; --muted:#6C6283; --line:#EADFCF;
  --c7:#F08A12; --c8:#0FA392; --c9:#1C7FE0; --c10:#E0357A; --cp:#8B3FD1; --cg:#2A1F3D;
  --ok:#159A5B; --okbg:#DFF6EA; --bad:#DB3A40; --badbg:#FDE6E7; --gold:#FFC93C;
  --felt:#16805F; --felt2:#0F6B4E;
  --stick:0 3px 0 rgba(42,31,61,.2);
  --display:"Fredoka","Trebuchet MS",system-ui,sans-serif;
  --body:"Atkinson Hyperlegible","Segoe UI",system-ui,sans-serif;
  color-scheme:light; box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --paper:#17122A; --card:#231C3C; --ink:#F6F1FF; --muted:#B6ACD2; --line:#3A305E;
    --c7:#FFA23E; --c8:#2CC7B4; --c9:#4FA6FF; --c10:#FF5E97; --cp:#B67BFF; --cg:#F6F1FF;
    --ok:#3DD68C; --okbg:#123A29; --bad:#FF6B70; --badbg:#431C25;
    --felt:#0F5A43; --felt2:#0B4635;
    --stick:0 3px 0 rgba(0,0,0,.45); color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --paper:#17122A; --card:#231C3C; --ink:#F6F1FF; --muted:#B6ACD2; --line:#3A305E;
  --c7:#FFA23E; --c8:#2CC7B4; --c9:#4FA6FF; --c10:#FF5E97; --cp:#B67BFF; --cg:#F6F1FF;
  --ok:#3DD68C; --okbg:#123A29; --bad:#FF6B70; --badbg:#431C25;
  --felt:#0F5A43; --felt2:#0B4635;
  --stick:0 3px 0 rgba(0,0,0,.45); color-scheme:dark;
}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--body);font-size:17px;line-height:1.55;-webkit-font-smoothing:antialiased;overflow-x:hidden}
button{font:inherit;color:inherit}
h1,h2,h3,h4{font-family:var(--display);line-height:1.15;margin:0}
.wrap{max-width:1040px;margin:0 auto;padding:0 16px}
[hidden]{display:none!important}
:focus-visible{outline:3px solid var(--c9);outline-offset:3px;border-radius:8px}

/* HERO */
.hero{position:relative;overflow:hidden;padding:34px 0 0}
.hero h1{font-size:clamp(2.5rem,8vw,4.6rem);font-weight:700;letter-spacing:-.01em;max-width:11ch}
.hero p.sub{font-size:1.12rem;max-width:46ch;color:var(--muted);margin:10px 0 0}
.hero svg{display:block;width:100%;height:auto;margin-top:6px}
.die3d{cursor:pointer}
.themebtn{position:absolute;top:14px;right:14px;z-index:5}

/* NAV */
nav.tabs{position:sticky;top:0;z-index:30;background:color-mix(in srgb,var(--paper) 90%,transparent);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-bottom:2px solid var(--line);padding-top:env(safe-area-inset-top,0px)}
nav.tabs .wrap{display:flex;gap:8px;overflow-x:auto;padding-top:10px;padding-bottom:10px;scrollbar-width:none}
nav.tabs .wrap::-webkit-scrollbar{display:none}
.tab{flex:0 0 auto;border:2px solid var(--line);background:var(--card);border-radius:999px;padding:8px 14px;font-family:var(--display);font-weight:600;font-size:.98rem;cursor:pointer;display:flex;align-items:center;gap:7px;white-space:nowrap}
.tab .dot{width:12px;height:12px;border-radius:50%;background:var(--tc)}
.tab[aria-current="page"]{background:var(--tc);border-color:var(--tc);color:var(--paper);box-shadow:var(--stick)}
.tab[aria-current="page"] .dot{background:var(--paper)}
main{padding:26px 0 60px}

/* GENERIC */
.btn{border:0;cursor:pointer;background:var(--lc,var(--c9));color:#fff;font-family:var(--display);font-weight:600;font-size:1.02rem;padding:11px 20px;border-radius:14px;box-shadow:var(--stick);transition:transform .1s}
.btn:active{transform:translateY(2px);box-shadow:none}
.btn:disabled{opacity:.4;cursor:not-allowed}
.btn.ghost{background:var(--card);color:var(--ink);box-shadow:inset 0 0 0 2px var(--line)}
.btn.light{background:var(--paper);color:var(--ink)}
.btn.big{font-size:1.15rem;padding:14px 26px}
.icon{border:0;background:var(--card);box-shadow:inset 0 0 0 2px var(--line);width:38px;height:38px;border-radius:50%;cursor:pointer;font-size:1rem;display:inline-grid;place-items:center;flex:0 0 38px}
.lhead{display:flex;gap:16px;align-items:center;margin-bottom:14px}
.lnum{flex:0 0 72px;height:72px;border-radius:50% 50% 50% 14%;background:var(--lc);color:#fff;font-family:var(--display);font-weight:700;font-size:2.2rem;display:grid;place-items:center;box-shadow:var(--stick)}
.lhead h2{font-size:clamp(1.6rem,4vw,2.3rem)}
.lhead p{margin:4px 0 0;color:var(--muted);max-width:62ch}
h3.sec{font-size:1.5rem;margin:34px 0 6px}
p.hint{color:var(--muted);margin:0 0 14px}
.panel{background:var(--card);border-radius:22px;padding:18px;box-shadow:inset 0 0 0 2px var(--line),var(--stick)}
.who{font-weight:700;color:var(--lc,var(--c9))}
.tw{font-weight:700;background:color-mix(in srgb,var(--lc,var(--c9)) 18%,transparent);padding:0 4px;border-radius:6px}

/* HOME */
.zones{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:14px;margin-top:18px}
.zone{border:0;text-align:left;cursor:pointer;background:var(--card);border-radius:22px 22px 22px 6px;padding:16px;box-shadow:inset 0 0 0 2px var(--line),var(--stick);position:relative;overflow:hidden;transition:transform .15s;min-height:150px}
.zone:hover{transform:translateY(-3px)}
.zone::before{content:"";position:absolute;right:-28px;top:-28px;width:100px;height:100px;border-radius:50%;background:var(--tc)}
.zone .n{font-family:var(--display);font-weight:700;font-size:1.8rem;color:#fff;position:absolute;right:14px;top:6px}
.zone h3{font-size:1.2rem;margin:34px 0 4px;max-width:14ch}
.zone small{color:var(--muted);display:block}
.zone .pips{display:flex;gap:5px;margin-top:10px}
.zone .pips i{width:16px;height:8px;border-radius:9px;background:var(--line)}
.zone .pips i.on{background:var(--tc)}
.zone.wide{grid-column:1/-1;background:var(--ink);color:var(--paper);box-shadow:var(--stick);display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap;min-height:0;border-radius:22px}
.zone.wide::before{display:none}
.zone.wide h3{margin:0;font-size:1.5rem;max-width:none}
.zone.wide small{color:inherit;opacity:.8;max-width:56ch}
.roster{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
.kid{border:0;cursor:pointer;display:inline-flex;align-items:center;gap:8px;background:var(--card);border-radius:999px;padding:5px 14px 5px 5px;box-shadow:inset 0 0 0 2px var(--line);font-weight:700}
.kid .av{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;color:#fff;font-family:var(--display);font-size:.95rem;background:var(--kc)}
.kid[aria-pressed="true"]{box-shadow:inset 0 0 0 3px var(--kc);background:color-mix(in srgb,var(--kc) 14%,var(--card))}
.starring{margin-top:14px}
.starring li{margin-bottom:8px}
.starring .lab{font-size:.85rem;font-weight:700;padding:1px 8px;border-radius:9px;color:#fff;margin-right:6px;font-family:var(--display)}

/* LESSON STAGES */
.stagebar{display:flex;gap:8px;flex-wrap:wrap;margin:6px 0 18px}
.sbtn{border:0;cursor:pointer;background:var(--card);box-shadow:inset 0 0 0 2px var(--line);border-radius:14px;padding:9px 13px;font-family:var(--display);font-weight:600;display:flex;gap:6px;align-items:center}
.sbtn .st{font-size:.8rem}
.sbtn[aria-current="true"]{background:var(--lc);color:#fff;box-shadow:var(--stick)}
.sbtn.done:not([aria-current="true"]){box-shadow:inset 0 0 0 2px var(--lc)}
details.shelf{margin-top:34px}
details.shelf summary{cursor:pointer;font-family:var(--display);font-weight:600;font-size:1.15rem}
.shelfgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:10px;margin-top:12px}
.shelfgrid div{background:var(--card);border-radius:14px;padding:10px 12px;box-shadow:inset 0 0 0 2px var(--line);border-left:6px solid var(--lc);font-size:.95rem}
.shelfgrid b{font-family:var(--display);font-size:1.1rem}

/* MEET */
.meet{max-width:640px;margin:0 auto}
.mcard{background:var(--card);border-radius:28px;padding:22px;box-shadow:inset 0 0 0 3px var(--lc),var(--stick);text-align:center;position:relative}
.mcard .emo{font-size:4rem;line-height:1;display:block;animation:bob 2.4s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-6px) rotate(-4deg)}}
.mcard .word{font-family:var(--display);font-weight:700;font-size:2.4rem;margin-top:8px}
.mcard .pos{color:var(--muted);font-style:italic}
.mcard .msent{font-size:1.15rem;margin:16px auto 6px;max-width:44ch}
.mcard .ask{font-family:var(--display);font-weight:600;margin:16px 0 10px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.mcard .say{position:absolute;top:14px;right:14px}
.reveal{text-align:left;margin-top:14px;padding:14px;border-radius:16px;background:color-mix(in srgb,var(--lc) 10%,var(--card))}
.reveal ol{margin:0 0 8px;padding-left:22px}
.reveal .forms{font-size:.92rem;color:var(--muted);margin:0 0 8px}
.reveal .hook{margin:0;padding:8px 12px;border-radius:12px;background:var(--card)}
.dots{display:flex;gap:5px;justify-content:center;flex-wrap:wrap;margin:14px 0}
.dots i{width:10px;height:10px;border-radius:50%;background:var(--line)}
.dots i.ok{background:var(--ok)}.dots i.no{background:var(--bad)}.dots i.now{background:var(--ink)}
.navrow{display:flex;justify-content:space-between;gap:10px;margin-top:14px}

/* DRAG & DROP */
.dnd{position:relative;user-select:none;-webkit-user-select:none}
.pool{display:flex;flex-wrap:wrap;gap:10px;padding:14px;border-radius:18px;background:color-mix(in srgb,var(--lc,var(--c9)) 8%,var(--card));min-height:62px;border:2px dashed color-mix(in srgb,var(--lc,var(--c9)) 45%,var(--line))}
.pool:empty::after{content:"All placed ✨";color:var(--muted);font-family:var(--display);padding:6px}
.pool.sticky{position:sticky;top:calc(var(--navh,62px) + 6px);z-index:12;box-shadow:0 8px 18px -10px rgba(0,0,0,.35)}
.chip{display:inline-flex;align-items:center;gap:8px;background:var(--card);border:2px solid var(--ink);border-radius:999px;padding:7px 14px;font-weight:700;cursor:grab;user-select:none;-webkit-user-select:none;box-shadow:var(--stick);touch-action:none;max-width:100%;line-height:1.3}
.chip.long{border-radius:14px;font-weight:400;padding:9px 12px}
.chip:active{cursor:grabbing}
.chip.dragging{opacity:.35}
.chip .x{display:none;border:0;background:var(--ink);color:var(--paper);width:22px;height:22px;border-radius:50%;font-size:.72rem;cursor:pointer;flex:0 0 22px;padding:0}
.drop .chip .x{display:inline-grid;place-items:center}
.locked .chip .x{display:none!important}
.locked .chip{cursor:default}
.chip.ghost{position:fixed;z-index:1000;pointer-events:none;opacity:.95;transform:rotate(-3deg) scale(1.06);box-shadow:0 10px 24px rgba(0,0,0,.25)}
.chip.right{border-color:var(--ok);background:var(--okbg)}
.chip.wrong{border-color:var(--bad);background:var(--badbg)}
.pop{animation:pop .28s ease-out}
@keyframes pop{0%{transform:scale(.8)}60%{transform:scale(1.08)}100%{transform:scale(1)}}
.drop.hi{outline:3px solid var(--lc,var(--c9));outline-offset:2px;background:color-mix(in srgb,var(--lc,var(--c9)) 16%,var(--card))!important}
.bins{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:14px;margin-top:14px}
.bin{border-radius:22px;padding:12px;min-height:170px;background:var(--card);box-shadow:inset 0 0 0 3px var(--bc,var(--line));transition:background .15s}
.binlabel{font-family:var(--display);font-weight:600;font-size:1.2rem;margin:2px 4px 10px;color:var(--bc)}
.binbody{display:flex;flex-direction:column;align-items:flex-start;gap:8px}
.rows{display:grid;gap:10px;margin-top:14px}
.mrow{display:grid;grid-template-columns:minmax(150px,210px) 1fr;gap:12px;align-items:center;background:var(--card);border-radius:16px;padding:8px;box-shadow:inset 0 0 0 2px var(--line)}
.slot{min-height:46px;border-radius:999px;border:2px dashed var(--muted);display:flex;align-items:center;justify-content:center;padding:3px}
.slot.filled{border-style:solid;border-color:transparent}
.mdef{padding-right:6px}
.fix{display:block;font-size:.88rem;color:var(--ok);font-weight:700;margin-top:2px}
.blank{display:inline-flex;min-width:120px;min-height:40px;vertical-align:middle;border-bottom:3px solid var(--lc,var(--c9));border-radius:10px 10px 0 0;margin:3px 2px;padding:2px;justify-content:center;align-items:center;background:color-mix(in srgb,var(--lc,var(--c9)) 7%,transparent)}
.storytext{background:var(--card);border-radius:20px;padding:20px;box-shadow:inset 0 0 0 2px var(--line);line-height:2.3;font-size:1.05rem}
.sentlist{display:grid;gap:10px;margin-top:14px}
.sentlist .s{background:var(--card);border-radius:16px;padding:10px 14px;box-shadow:inset 0 0 0 2px var(--line);line-height:2.2}

/* MC / TF */
.q{background:var(--card);border-radius:20px;padding:16px 18px;margin-bottom:14px;box-shadow:inset 0 0 0 2px var(--line)}
.q .qt{font-weight:700;margin:0 0 10px;font-size:1.05rem}
.q .qt .num{display:inline-grid;place-items:center;width:28px;height:28px;border-radius:50%;background:var(--lc,var(--c9));color:#fff;font-family:var(--display);margin-right:8px;font-size:.9rem}
.opts{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:8px}
.opts.one{grid-template-columns:1fr}
.opt{text-align:left;border:0;cursor:pointer;background:var(--paper);border-radius:14px;padding:10px 14px;box-shadow:inset 0 0 0 2px var(--line);transition:transform .1s}
.opt:hover:not(:disabled){transform:translateY(-2px);box-shadow:inset 0 0 0 2px var(--lc,var(--c9))}
.opt:disabled{cursor:default}
.opt.sel{box-shadow:inset 0 0 0 3px var(--lc,var(--c9));background:color-mix(in srgb,var(--lc,var(--c9)) 12%,var(--card))}
.opt.right{background:var(--okbg);box-shadow:inset 0 0 0 3px var(--ok)}
.opt.wrong{background:var(--badbg);box-shadow:inset 0 0 0 3px var(--bad)}
.opt.missed{box-shadow:inset 0 0 0 3px var(--ok)}
.opt.wordopt{font-family:var(--display);font-weight:600;font-size:1.15rem;text-align:center}
.tf{display:flex;gap:10px}
.stamp{flex:1;border:0;cursor:pointer;font-family:var(--display);font-weight:700;font-size:1.2rem;padding:12px;border-radius:16px;background:var(--paper);box-shadow:inset 0 0 0 3px var(--line);transform:rotate(-1deg)}
.stamp.f{transform:rotate(1deg)}
.stamp:hover:not(:disabled){box-shadow:inset 0 0 0 3px var(--ink)}
.stamp.right{background:var(--okbg);box-shadow:inset 0 0 0 3px var(--ok)}
.stamp.wrong{background:var(--badbg);box-shadow:inset 0 0 0 3px var(--bad)}
.why{margin:10px 0 0;padding:10px 12px;border-radius:12px;font-size:.95rem}
.why.good{background:var(--okbg)}
.why.bad{background:var(--badbg)}
.bold{font-weight:700;color:var(--lc,var(--c9))}
.analogy{font-family:var(--display);font-weight:700;font-size:1.3rem;letter-spacing:.02em}
.pfoot{display:flex;justify-content:space-between;gap:12px;align-items:center;margin-top:18px;flex-wrap:wrap}
.pfoot .msg{font-family:var(--display);font-weight:600;font-size:1.15rem}

/* LIGHTNING */
.bolt{max-width:640px;margin:0 auto;text-align:center}
.timer{height:14px;border-radius:9px;background:var(--line);overflow:hidden;margin:10px 0}
.timer i{display:block;height:100%;background:var(--lc);width:100%;transition:width .25s linear}
.bstats{display:flex;justify-content:space-between;font-family:var(--display);font-weight:700;font-size:1.2rem}
.bq{font-size:1.25rem;font-weight:700;margin:18px 0 12px;min-height:3.2em}
.flash-ok{animation:fok .35s}
.flash-no{animation:fno .35s}
@keyframes fok{0%{box-shadow:inset 0 0 0 6px var(--ok)}}
@keyframes fno{0%{box-shadow:inset 0 0 0 6px var(--bad)}25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}

/* PASSAGE */
.scenes{display:grid;gap:16px;margin-top:16px}
.scene{display:grid;grid-template-columns:84px 1fr;gap:16px;background:var(--card);border-radius:24px;padding:18px;box-shadow:inset 0 0 0 2px var(--line),var(--stick)}
.scene .art{font-size:2.8rem;text-align:center;line-height:1.1}
.scene h3{font-size:1.3rem;margin-bottom:6px}
.scene p{margin:0;max-width:66ch}
.vw{border:0;background:color-mix(in srgb,var(--c10) 16%,transparent);color:inherit;font-weight:700;padding:0 5px;border-radius:7px;cursor:pointer;border-bottom:3px solid var(--c10)}
.vw.found{background:var(--c10);color:#fff}
.vw.bonus{background:color-mix(in srgb,var(--gold) 30%,transparent);border-bottom-color:var(--gold)}
.vw.bonus.found{background:var(--gold);color:#2A1F3D}
.hunt{position:sticky;top:calc(var(--navh,62px) + 6px);z-index:10;display:flex;gap:12px;align-items:center;background:var(--ink);color:var(--paper);border-radius:16px;padding:10px 16px;font-family:var(--display);font-weight:600;flex-wrap:wrap}
.hunt .meter{flex:1;min-width:120px;height:10px;background:rgba(127,127,127,.35);border-radius:9px;overflow:hidden}
.hunt .meter i{display:block;height:100%;width:0;background:var(--c10);transition:width .3s}
#pop{position:absolute;z-index:50;max-width:300px;background:var(--ink);color:var(--paper);padding:12px 14px;border-radius:14px;font-size:.95rem;box-shadow:0 10px 30px rgba(0,0,0,.3)}
#pop b{font-family:var(--display);font-size:1.1rem;color:var(--gold);display:block}
.facts{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-top:14px}
.fact{background:var(--card);border-radius:18px;padding:14px;box-shadow:inset 0 0 0 2px var(--line)}
.fact b{font-family:var(--display);font-size:1.8rem;color:var(--c10);display:block;line-height:1.05}

/* TYCOON */
.tycoon{background:linear-gradient(160deg,color-mix(in srgb,var(--cp) 22%,var(--card)),var(--card));border-radius:26px;padding:20px;box-shadow:inset 0 0 0 3px var(--cp),var(--stick)}
.cash{display:flex;align-items:center;gap:14px;flex-wrap:wrap;margin-bottom:12px}
.cash .money{font-family:var(--display);font-weight:700;font-size:2.4rem;line-height:1}
.cash .money.up{color:var(--ok)}.cash .money.down{color:var(--bad)}
.cash .bar{flex:1;min-width:140px;height:14px;border-radius:9px;background:var(--line);overflow:hidden}
.cash .bar i{display:block;height:100%;background:var(--cp);transition:width .6s}
.tyq{font-size:1.15rem;font-weight:700;margin:6px 0 12px}
.tyq small{display:block;font-weight:400;color:var(--muted);margin-top:4px}

/* BOARD */
.setup{display:grid;gap:14px}
#view-board .btop,#view-board .board,#view-board .blog{max-width:620px;margin-left:auto;margin-right:auto}
.board{display:grid;grid-template-columns:repeat(6,1fr);gap:6px;background:var(--felt);padding:10px;border-radius:24px;box-shadow:inset 0 0 0 6px var(--felt2),var(--stick)}
.sq{aspect-ratio:1;border-radius:14px;background:var(--sc,#fff);position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;color:#fff;font-family:var(--display);font-weight:700;text-align:center;line-height:1.05;font-size:.72rem;padding:3px;box-shadow:inset 0 -4px 0 rgba(0,0,0,.18)}
.sq .ic{font-size:1.35rem}
.sq.special{background:var(--gold);color:#2A1F3D}
.sq.start,.sq.finish{background:#fff;color:#2A1F3D}
.sq .num{position:absolute;top:3px;left:6px;font-size:.62rem;opacity:.75}
.tokens{position:absolute;inset:auto 2px 2px 2px;display:flex;flex-wrap:wrap;justify-content:center;gap:2px}
.tok{width:22px;height:22px;border-radius:50%;background:var(--kc);color:#fff;border:2px solid #fff;display:inline-grid;place-items:center;font-size:.66rem;font-family:var(--display);box-shadow:0 2px 4px rgba(0,0,0,.35)}
.tok.hop{animation:hop .28s ease-out}
@keyframes hop{50%{transform:translateY(-14px) scale(1.15)}}
.btop{display:flex;align-items:center;gap:14px;flex-wrap:wrap;margin-bottom:12px}
.turn{font-family:var(--display);font-weight:700;font-size:1.3rem;display:flex;align-items:center;gap:8px}
.die{width:74px;height:74px;border-radius:18px;background:var(--card);box-shadow:inset 0 0 0 3px var(--ink),var(--stick);font-size:3.4rem;line-height:1;display:grid;place-items:center;cursor:pointer;border:0;color:var(--ink)}
.die.roll{animation:roll .6s ease-out}
@keyframes roll{0%{transform:rotate(0) scale(1)}50%{transform:rotate(200deg) scale(1.2)}100%{transform:rotate(360deg) scale(1)}}
.scores{display:flex;gap:8px;flex-wrap:wrap;margin-top:4px}
.scores span{display:inline-flex;gap:6px;align-items:center;padding:4px 10px;border-radius:999px;background:var(--card);box-shadow:inset 0 0 0 2px var(--line);font-weight:700;font-size:.92rem}
.scores span.now{box-shadow:inset 0 0 0 3px var(--kc)}
.blog{margin-top:12px;font-weight:700;min-height:1.6em}

/* MODAL */
.modal{position:fixed;inset:0;z-index:200;background:rgba(20,14,35,.6);display:grid;place-items:center;padding:16px}
.modal .box{background:var(--card);border-radius:24px;padding:20px;max-width:560px;width:100%;max-height:90vh;overflow:auto;box-shadow:0 20px 50px rgba(0,0,0,.4);border-top:10px solid var(--lc,var(--c9))}
.modal h3{font-size:1.3rem;margin-bottom:6px}

/* QUIZ */
.qtop{display:flex;justify-content:space-between;align-items:center;gap:14px;flex-wrap:wrap;margin-bottom:12px}
.qtrack{display:flex;gap:6px;flex-wrap:wrap}
.qtrack span{width:24px;height:10px;border-radius:9px;background:var(--line)}
.qtrack span.now{background:var(--ink)}.qtrack span.good{background:var(--ok)}.qtrack span.meh{background:var(--c7)}.qtrack span.low{background:var(--bad)}
.total{font-family:var(--display);font-weight:700;font-size:1.2rem}
.phead{display:flex;gap:14px;align-items:center;background:var(--ink);color:var(--paper);border-radius:22px;padding:16px 18px;margin-bottom:16px}
.phead .pemo{font-size:2.4rem}
.phead h3{font-size:1.4rem}
.phead p{margin:2px 0 0;opacity:.85}
.results{text-align:center;padding:10px 0}
.results .pct{font-family:var(--display);font-weight:700;font-size:clamp(3.5rem,14vw,6rem);line-height:1}
.results .stars{font-size:2.4rem;margin:6px 0}
.breakdown{display:grid;gap:6px;max-width:560px;margin:22px auto;text-align:left}
.breakdown div{display:flex;justify-content:space-between;gap:10px;background:var(--card);padding:8px 14px;border-radius:12px;box-shadow:inset 0 0 0 2px var(--line)}
.review{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:10px;text-align:left;margin:14px 0 24px}
.review div{background:var(--card);border-radius:14px;padding:10px 12px;box-shadow:inset 0 0 0 2px var(--line);border-left:6px solid var(--tc)}
.review b{font-family:var(--display);font-size:1.1rem}
#confetti{position:fixed;inset:0;pointer-events:none;z-index:999}
footer{color:var(--muted);text-align:center;font-size:.9rem;padding:20px 0 40px}

@media (max-width:720px){
  .mrow{grid-template-columns:1fr}
  .scene{grid-template-columns:1fr}
  .scene .art{text-align:left}
  body{font-size:16px}
  .two{grid-template-columns:1fr}
  .sq{font-size:.56rem;border-radius:10px}
  .sq .ic{font-size:1.05rem}
  .tok{width:18px;height:18px;font-size:.55rem}
  .board{gap:4px;padding:7px}
}
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation:none!important;transition:none!important}
}
</style>
</head>

const KC=["#E0357A","#F08A12","#0FA392","#1C7FE0","#8B3FD1","#D9480F","#2F9E44","#C2255C","#1098AD","#5F3DC4","#E67700","#0B7285","#9C36B5","#2B8A3E","#C92A2A","#364FC7","#A61E4D"];

/* ============================ WORDS ============================ */
/* ex = classmate sentence; [brackets] mark the word as it's used */
const LESSONS=[
 {n:7,title:"Home on the Range",color:"var(--c7)",blurb:"Cowboy words: tough ponies, hungry trail hands, and long, monotonous days on the range.",
  words:[
   {w:"brawl",e:"🥊",pos:"noun / verb",d:["n. A rough, noisy fight.","v. To fight noisily."],ex:"Two seagulls had a [brawl] over Luke's dropped french fry at Frigate Bay.",h:"A brawl is loud and rough, like a fight in a cowboy movie.",m:"a rough, noisy fight"},
   {w:"casual",e:"👕",pos:"adjective",d:["Not planned.","Not regular; occasional.","Suitable for everyday use; comfortable."],ex:"On dress-down Friday, Aeva wore [casual] clothes: shorts and sneakers.",h:"Casual = relaxed: no plan, nothing fancy.",m:"not planned; occasional; comfortable for everyday use"},
   {w:"constant",e:"🔁",pos:"adjective",d:["Not changing.","Loyal; faithful.","Without a pause; unending."],ex:"Coryn's dog is her [constant] companion; he follows her everywhere.",h:"Constant = never stops, never changes, like the waves at the beach.",m:"not changing; loyal; without a pause"},
   {w:"excel",e:"🏅",pos:"verb",d:["To do well; to be better or greater than others."],ex:"Jordan [excels] at football and scores in almost every match.",h:"Excel sounds like EXCELlent.",m:"to do well; to be better than others"},
   {w:"exhaust",e:"😮‍💨",pos:"verb / noun",d:["v. To use up.","v. To tire out.","n. The waste gases from an engine; the system that pumps them out."],ex:"Running laps in the midday sun [exhausted] Andre.",h:"Exhaust = all used up. Even a car's exhaust is used-up gas.",m:"to use up; to tire out"},
   {w:"hardy",e:"🌵",pos:"adjective",d:["Able to survive under bad conditions; tough."],ex:"Zamari's [hardy] aloe plant survived the whole dry season.",h:"Hardy sounds like HARD: tough enough to survive.",m:"able to survive under bad conditions; tough"},
   {w:"mediocre",e:"😐",pos:"adjective",d:["Of low to medium quality; barely passable."],ex:"Vihan said the movie was [mediocre]: not terrible, but not good either.",h:"Mediocre = medium. Not bad, not great: just meh.",m:"of low to medium quality; barely passable"},
   {w:"monotonous",e:"🥱",pos:"adjective",d:["Always the same; not varying; boring."],f:"monotony (n.): lack of variety that leads to boredom",ex:"Copying lines is [monotonous], so Leila hums a tune while she works.",h:"MONO = one. One tone, over and over: boring!",m:"always the same; boring"},
   {w:"originate",e:"🌱",pos:"verb",d:["To bring or come into being."],f:"origin (n.): a beginning",ex:"Markisio learned that the steel pan [originated] in Trinidad.",h:"ORIGIN-ate: where something began.",m:"to bring or come into being; to begin"},
   {w:"punctuate",e:"❗",pos:"verb",d:["To add marks such as commas and periods to writing.","To interrupt from time to time."],f:"punctuation (n.): the use of marks such as commas and periods",ex:"Bangs of fireworks [punctuated] the Sugar Mas parade, and Shiloh cheered at every one.",h:"Punctuation marks break up a sentence. Fireworks can break up the night.",m:"to add commas and periods; to interrupt from time to time"},
   {w:"ravenous",e:"🍔",pos:"adjective",d:["Very hungry.","Eager for whatever satisfies one's needs or wants."],ex:"After swim practice, Deacon was so [ravenous] he ate three johnny cakes.",h:"Ravenous = hungry as a raven that hasn't eaten all day.",m:"very hungry"},
   {w:"realistic",e:"🎯",pos:"adjective",d:["Closely resembling real life.","Aware of things as they are; practical."],ex:"Jessie's drawing of a vervet monkey is so [realistic] it looks like a photo.",h:"Realistic = looks REAL, or is really possible.",m:"closely resembling real life; practical"},
   {w:"soothe",e:"🧴",pos:"verb",d:["To make calm and relaxed.","To relieve soreness; to make less painful."],ex:"Miquea sang a lullaby to [soothe] her crying baby cousin.",h:"Soothe = smooth things over: calm the person, calm the pain.",m:"to calm; to make less painful"},
   {w:"stampede",e:"🐃",pos:"noun / verb",d:["n. A sudden rush of animals or people, usually caused by fear.","v. To take part in a stampede."],ex:"When the lunch bell rang, there was a [stampede] to the canteen, and Amar'J was at the front.",h:"A stampede is a STAMPing, panicked rush.",m:"a sudden rush of frightened animals or people"},
   {w:"veteran",e:"🎖️",pos:"noun / adjective",d:["n. A person who has served in the armed forces.","n. A person with much experience.","adj. Experienced."],ex:"Kosisochukuw is a [veteran] of the school choir; she has sung in it for five years.",h:"A veteran has been there and done that, for years.",m:"a person who served in the armed forces; a person with much experience"}
  ],
  sort:[["Jordan excels at cricket and was named player of the match.",1],["Andre was ravenous after skipping lunch, so he ate two sandwiches.",1],["Anna's hardy cactus survived a whole month without water.",1],["Leila found the roller coaster so monotonous that she screamed with excitement the whole time.",0],["Vihan's mediocre score was the best perfect score in the whole school.",0],["The cows stampeded calmly, one slow step at a time.",0]]},
 {n:8,title:"Explorers & Treasures",color:"var(--c8)",blurb:"Words for expeditions, wide-open spaces, and things worth retrieving.",
  words:[
   {w:"accompany",e:"🎺",pos:"verb",d:["To go along with; to be together.","To play a musical instrument for or with."],ex:"Adiaha's dad [accompanied] her on trumpet while she sang.",h:"ac-COMPANY: keep someone company. Musicians accompany singers.",m:"to go along with; to play music with"},
   {w:"beneficial",e:"💪",pos:"adjective",d:["Being of use; helpful; favorable."],ex:"Eating fruit is [beneficial] to your health, so Anna packs a mango every day.",h:"BENE = good (like benefit). Beneficial is good for you.",m:"helpful; favorable"},
   {w:"captive",e:"⛓️",pos:"noun / adjective",d:["n. One that is held prisoner.","adj. Unable to escape or get away."],f:"captivity (n.): being held against one's will",ex:"The bus was stuck in traffic, so Luke's jokes had a [captive] audience.",h:"A captive is captured. A captive audience can't leave!",m:"one held prisoner; unable to escape"},
   {w:"convenient",e:"🏪",pos:"adjective",d:["Suitable for one's needs; making life easier or more comfortable."],f:"convenience (n.): anything that makes life easier",ex:"The shop next to school is [convenient] when Jessie forgets her pencil.",h:"Convenient = easy and handy, like a shop right next door.",m:"suitable for one's needs; making life easier"},

   {w:"expedition",e:"🧭",pos:"noun",d:["A long journey by a group to explore or do battle.","A group that makes such a journey."],ex:"Deacon led an [expedition] up the hill to find the biggest mango tree.",h:"An expedition is an exploring journey with a team.",m:"a long journey by a group to explore; the group itself"},
   {w:"inept",e:"🤦",pos:"adjective",d:["Clumsily or awkwardly expressed; not suitable for the occasion.","Lacking in skill or ability."],ex:"Coryn's toy robot was so [inept] that it tried to put the milk in the oven.",h:"Inept = NOT adept: clumsy, no skill.",m:"clumsy or awkward; lacking skill"},
   {w:"interpret",e:"🗣️",pos:"verb",d:["To translate into another language.","To explain the meaning of.","To understand in one's own way."],ex:"Kosisochukuw [interpreted] the Spanish song for the class.",h:"Interpreters translate. To interpret is to figure out the meaning.",m:"to translate; to explain the meaning of"},
   {w:"invaluable",e:"💎",pos:"adjective",d:["Too valuable to measure; priceless."],ex:"Vihan's help with the science project was [invaluable].",h:"Careful! IN-valuable means MORE than valuable: priceless.",m:"too valuable to measure; priceless"},
   {w:"linger",e:"🐌",pos:"verb",d:["To be slow in leaving or going away."],ex:"Shiloh [lingered] at the beach, not wanting the day to end.",h:"Linger like the smell of cake after it's all eaten: slow to leave.",m:"to be slow in leaving"},

   {w:"skirmish",e:"🎈",pos:"noun / verb",d:["n. A minor fight or battle.","v. To take part in such a fight."],ex:"Amar'J and Andre had a quick water-balloon [skirmish] after sports day.",h:"A skirmish is a SMALL fight. A brawl is a big noisy one.",m:"a minor fight or battle"},
   {w:"supplement",e:"➕",pos:"noun / verb",d:["n. Something added to make up for something missing.","v. To add to."],ex:"Aeva [supplements] her lunch with an extra banana.",h:"A supplement is an add-on, like a vitamin.",m:"something added; to add to"},
   {w:"territory",e:"🗺️",pos:"noun",d:["A particular area of land.","A land area under control of a particular group or government."],ex:"Leila's cat guards its [territory] from the neighbor's cat.",h:"Territory: TERRa means land.",m:"an area of land; land controlled by a group or government"}
  ],
  sort:[["Luke lingered after the party to help clean up.",1],["Jessie was ecstatic when she got a puppy for her birthday.",1],["A good night's sleep is beneficial before a big test.",1],["Coryn's expedition lasted two seconds and went from her bed to her door.",0],["Deacon retrieved the ball by kicking it far out to sea.",0],["The invaluable old pencil was worth nothing at all.",0]]},
 {n:9,title:"Water, Water, Everywhere",color:"var(--c9)",blurb:"Words about saving water and resources, and what happens when we don't.",

   {w:"aggravate",e:"😠",pos:"verb",d:["To make worse.","To anger or annoy."],f:"aggravation (n.): annoyance; a source of annoyance",ex:"Miquea learned that scratching a mosquito bite only [aggravates] it.",h:"Aggravate makes things worse AND annoys you.",m:"to make worse; to annoy"},
   {w:"conserve",e:"🚰",pos:"verb",d:["To save by using carefully."],f:"conservation (n.): saving or protecting something through careful use",ex:"Deacon turns off the tap while brushing his teeth to [conserve] water.",h:"Conserve = save it, don't waste it.",m:"to save by using carefully"},
   {w:"contaminate",e:"☣️",pos:"verb",d:["To harm by contact with something undesirable."],f:"contamination (n.): the act or result of contaminating",ex:"Oil leaking from a boat [contaminated] the water near Coryn's favorite beach.",h:"Contaminate = dirty it with something harmful.",m:"to harm by contact with something undesirable"},
   {w:"diminish",e:"📉",pos:"verb",d:["To make or become smaller or less; to reduce."],ex:"Shiloh's after-school snack [diminished] her hunger until dinner.",h:"Diminish = make it mini.",m:"to make or become smaller; to reduce"},

   {w:"impurity",e:"🧪",pos:"noun",d:["Something that is harmful or dirty."],ex:"Vihan's water filter removes [impurities] from the water.",h:"Im-PURE-ity: something that isn't pure.",m:"something that is harmful or dirty"},
   {w:"peril",e:"⚠️",pos:"noun",d:["Danger; something that is dangerous."],f:"imperil (v.): to place in danger; perilous (adj.): dangerous",ex:"In Luke's story, the pirates sailed into great [peril] during a hurricane.",h:"Peril = danger. Perilous = dangerous.",m:"danger"},

   {w:"brief",e:"⏱️",pos:"adjective / verb / noun",d:["adj. Short; not long-lasting.","v. To give a short explanation or set of instructions to.","n. A statement giving the main points in a case, for use in a court of law."],ex:"The rain shower was [brief], so Miquea's picnic went ahead.",h:"Brief = short. Even a lawyer's brief is a short summary.",m:"short; not long-lasting"},
   {w:"brisk",e:"🏃",pos:"adjective",d:["Quick; active.","Stimulating; refreshing."],ex:"Jessie took a [brisk] walk along the beach in the cool morning breeze.",h:"Brisk = quick and fresh, like a morning walk in a cool breeze.",m:"quick; active; refreshing"},
   {w:"budget",e:"💰",pos:"noun / verb",d:["n. A plan for spending money during a certain period.","v. To plan the use of carefully."],ex:"Zamari made a [budget] so his allowance would last the whole month.",h:"A budget is a money plan: where every dollar goes.",m:"a plan for spending money"},
   {w:"compete",e:"🏁",pos:"verb",d:["To try to win against others."],f:"competition (n.): a contest; competitor (n.): one who competes",ex:"Sixteen students [competed] in the class spelling bee, and Leila won.",h:"Compete = try to win. Competitors are in a competition.",m:"to try to win against others"},
   {w:"complicate",e:"🧶",pos:"verb",d:["To make difficult."],f:"complicated (adj.): not easy or simple; having many different parts",ex:"Adding a third team [complicated] Shiloh's tournament plan.",h:"Complicate = add more pieces until it's hard.",m:"to make difficult"},
   {w:"effect",e:"✨",pos:"verb / noun",d:["v. To make happen.","n. A result."],f:"effective (adj.): bringing about the desired result; in operation; making a strong impression",ex:"The new reading corner had a big [effect]: Aeva read five books in one week.",h:"Effect = the result. Effective = it works!",m:"a result; to make happen"},
   {w:"err",e:"❌",pos:"verb",d:["To be wrong or to do wrong."],f:"error (n.): a mistake; erroneous (adj.): mistaken; wrong",ex:"Deacon [erred] when he added instead of subtracting.",h:"Err rhymes with 'her'. To err is to make an error.",m:"to be wrong or do wrong"},
   {w:"factor",e:"🧩",pos:"noun",d:["Something that contributes to a result."],ex:"Daily practice was a big [factor] in Vihan's win at the science fair.",h:"A factor is one of the reasons something happened.",m:"something that contributes to a result"},

    host.innerHTML=`<div class="meet"><p class="hint" style="text-align:center">Read the sentence and guess what the word means. Then learn the real meaning.</p>
    <div class="mcard" id="mc"><button class="icon say" aria-label="Say ${w.w}">🔊</button><span class="emo">${w.e}</span><div class="word">${w.w}</div><div class="pos">${w.pos}</div>
      <p class="msent">“${exHTML(w)}”</p><p class="ask">What does <b>${w.w}</b> mean?</p>
      <div class="two">${opts.map(o=>`<button class="opt" data-ok="${o===w.m?1:0}">${o}</button>`).join("")}</div><div id="rv"></div></div>
    <div class="dots">${order.map((x,k)=>`<i class="${k===i?"now":res[k]===1?"ok":res[k]===0?"no":""}"></i>`).join("")}</div></div>`;

      $$(".two .opt",host).forEach(o=>{o.disabled=true;if(o.dataset.ok==="1")o.classList.add("right")});if(!ok)b.classList.add("wrong");
      $("#mc").classList.add(ok?"flash-ok":"flash-no");
      $("#rv").innerHTML=`<div class="reveal"><b>${ok?"✅ You got it!":"❌ Not this time. Here's the real meaning:"}</b><ol>${w.d.map(x=>`<li>${x}</li>`).join("")}</ol>${w.f?`<p class="forms">Word family: ${w.f}</p>`:""}<p class="hook">💡 ${w.h}</p>
      <div class="navrow" style="justify-content:flex-end"><button class="btn" id="mn">${i<order.length-1?"Next word":"Finish"}</button></div></div>`;
      $("#mn").onclick=()=>{i++;if(i<order.length)draw();else{const s=res.filter(x=>x).length;host.innerHTML=`<div class="panel" style="text-align:center"><h3 style="font-size:1.6rem">You met all 15 words! 🎉</h3><p>You guessed <b>${s} of 15</b> right on the first try. Now let's lock them in.</p></div>`;if(s>=12)confetti(.8);done(s,15)}};
      $("#mn").focus({preventScroll:true});
    };
  };draw();
}

let boltTimer=null;function stopBolt(){if(boltTimer){clearInterval(boltTimer);boltTimer=null}}
function makeQ(L){

  if(Math.random()<.5)return {q:`Which word means <b>“${w.m}”</b>?`,opts:shuffle([w,...dis]).map(x=>x.w),ans:w.w,w:w.w};
  return {q:`“${exBlank(w)}”`,opts:shuffle([w,...dis]).map(form),ans:form(w),w:w.w};
}
function boltGame(host,L,done){

      if(ok){streak++;right++;score+=streak>=5?3:streak>=3?2:1;bp.classList.add("flash-ok")}else{streak=0;wrong++;missed.add(cur.w);bp.classList.add("flash-no")}
      $("#bs").textContent=streak+(streak>=5?" ×3":streak>=3?" ×2":"");$("#bsc").textContent=score;nextQ()};
    nextQ();

      $("#bagain"+L.n).onclick=()=>boltGame(host,L,done);if(nb||(!wrong&&right))confetti(1);done(right,right+wrong)}},1000);

function chipHTML(text,data,poolId,long){const attrs=Object.entries(data).map(([k,v])=>`data-${k}="${esc(v)}"`).join(" ");return `<div class="chip${long?" long":""}" draggable="true" data-pool="${poolId}" ${attrs}><span>${text}</span><button class="x" aria-label="Send back">✕</button></div>`}
function sortHTML(items,bins){const id=uid();return `<div class="dnd" id="${id}"><div class="pool" id="${id}-pool">${items.map(it=>chipHTML(it.text,{bin:it.bin,w:it.w||""},id+"-pool",true)).join("")}</div><div class="bins">${bins.map(b=>`<div class="drop many bin" data-bin="${b.key}" style="--bc:${b.c}"><div class="binlabel">${b.label}</div><div class="binbody"></div></div>`).join("")}</div></div>`}

function wireMC(body,items,done,whyFn){let answered=0,score=0;const missed=[];
  body.addEventListener("click",e=>{const b=e.target.closest(".opt");if(!b||b.disabled)return;const q=b.closest(".q");if(!q||q.dataset.qi===undefined)return;const it=items[+q.dataset.qi];
    $$(".opt",q).forEach(o=>{o.disabled=true;if(o.dataset.ok==="1")o.classList.add(o===b?"right":"missed")});
    const ok=b.dataset.ok==="1";if(!ok){b.classList.add("wrong");missed.push(it.w)}else score++;
    const why=whyFn?whyFn(it,ok):(ok?"Yes!":`The answer is “${it.correct}”.`);
    q.insertAdjacentHTML("beforeend",`<p class="why ${ok?"good":"bad"}">${ok?"✅ ":"❌ "}${why}</p>`);
    if(++answered===items.length)done(score,items.length,missed)})}
function buildParts(){

  parts.push({emoji:"✅",title:"True or false",intro:"Stamp each statement. Watch for sneaky ones!",render:tfPart});
  parts.push({emoji:"🔤",title:"Which word fits?",intro:"Pick the word that makes the sentence make sense.",render:fitPart});
  parts.push({emoji:"🗣️",title:"Which sentence is right?",intro:"Only ONE sentence uses the word correctly. Find it!",render:sentPart});
  parts.push({emoji:"🎭",title:"Same word, different meaning",intro:"These words have more than one meaning. Which one is used here?",render:meanPart});
  parts.push({emoji:"☑️",title:"Pick ALL that apply",intro:"There may be more than one right answer. Choose every one, then check.",render:selectPart});

function tfPart(body,done){const items=shuffle(TF);let answered=0,score=0;const missed=[];
  body.innerHTML=items.map(([s],i)=>`<div class="q" data-i="${i}"><p class="qt"><span class="num">${i+1}</span>${s}</p><div class="tf"><button class="stamp" data-v="1">👍 True</button><button class="stamp f" data-v="0">👎 False</button></div></div>`).join("");
  body.addEventListener("click",e=>{const b=e.target.closest(".stamp");if(!b||b.disabled)return;const q=b.closest(".q");const [,ans,why,w]=items[+q.dataset.i];
    $$(".stamp",q).forEach(x=>x.disabled=true);const ok=(b.dataset.v==="1")===ans;b.classList.add(ok?"right":"wrong");if(ok)score++;else missed.push(w);
    q.insertAdjacentHTML("beforeend",`<p class="why ${ok?"good":"bad"}">${ok?"✅ Right!":"❌ It's "+(ans?"TRUE":"FALSE")+"."} ${why}</p>`);if(++answered===items.length)done(score,items.length,missed)})}
function fitPart(body,done){const items=shuffle(FIT).map(([s,o,w])=>({q:nameSpan(s.replace("____",'<span class="bold">_______</span>')),correct:o[0],shuffled:shuffle(o),w,raw:s}));
  body.innerHTML=mcHTML(items);wireMC(body,items,done,it=>`“${nameSpan(it.raw.replace("____","<b>"+it.correct+"</b>"))}”`)}
function sentPart(body,done){const items=shuffle(SENT).slice(0,10).map(([w,o])=>({q:`Which sentence uses <span class="bold">${w}</span> correctly?`,correct:o[0],shuffled:shuffle(o),w}));
  body.innerHTML=mcHTML(items,true);
  wireMC(body,items,done,(it,ok)=>ok?`Yes! <b>${it.w}</b> means ${WORD[it.w].m}.`:`<b>${it.w}</b> means ${WORD[it.w].m}, so the right sentence is: “${nameSpan(it.correct)}”`)}
function meanPart(body,done){const items=shuffle(MEAN).slice(0,12).map(([s,o,w])=>({q:nameSpan(s),correct:o[0],shuffled:shuffle(o),w}));body.innerHTML=mcHTML(items);wireMC(body,items,done,(it,ok)=>ok?`Yes, here it means “${it.correct}.”`:`Here it means “${it.correct}.”`)}
function selectPart(body,done){const items=shuffle(SELECT);let checked=0,score=0;const missed=[];
  body.innerHTML=items.map(([q,o],i)=>`<div class="q" data-i="${i}"><p class="qt"><span class="num">${i+1}</span>${q}</p><div class="opts">${shuffle(o).map(([t,ok])=>`<button class="opt" data-ok="${ok}" aria-pressed="false">${nameSpan(t)}</button>`).join("")}</div><div style="margin-top:10px"><button class="btn ghost chk">Check</button></div></div>`).join("");
  body.addEventListener("click",e=>{const o=e.target.closest(".opt");if(o&&!o.disabled){o.classList.toggle("sel");o.setAttribute("aria-pressed",o.classList.contains("sel"));return}
    const c=e.target.closest(".chk");if(!c)return;const q=c.closest(".q");c.remove();let ok=true;
    $$(".opt",q).forEach(x=>{x.disabled=true;const want=x.dataset.ok==="1",got=x.classList.contains("sel");x.classList.remove("sel");if(want&&got)x.classList.add("right");else if(!want&&got){x.classList.add("wrong");ok=false}else if(want&&!got){x.classList.add("missed");ok=false}});
    if(ok)score++;else missed.push(items[+q.dataset.i][2]);q.insertAdjacentHTML("beforeend",`<p class="why ${ok?"good":"bad"}">${ok?"✅ You got every one!":"❌ Not quite. Green outlines show every right answer."}</p>`);if(++checked===items.length)done(score,items.length,missed)})}
function storyPart(body,done,s){const id=uid();const answers=[...s.text.matchAll(/\[([^\]]+)\]/g)].map(m=>m[1]);const chips=shuffle([...answers,...s.decoys]);
  body.style.setProperty("--lc",s.color);
  body.innerHTML=`<div class="dnd" id="${id}"><div class="pool sticky" id="${id}-pool">${chips.map(c=>chipHTML(c,{val:c},id+"-pool")).join("")}</div><div class="storytext" style="margin-top:14px"><h4 style="font-size:1.3rem;margin-bottom:6px">${s.title}</h4>${nameSpan(s.text).replace(/\[([^\]]+)\]/g,(m,a)=>`<span class="drop one blank" data-ans="${a}"></span>`)}</div></div>`;
  checkBtn(body,"Check my story",()=>{const g=$("#"+id);g.classList.add("locked");let sc=0;const missed=[];
    $$(".blank",g).forEach(bl=>{const c=bl.querySelector(".chip");const ok=c&&c.dataset.val===bl.dataset.ans;if(c)c.classList.add(ok?"right":"wrong");if(ok)sc++;else{missed.push(BASE[bl.dataset.ans]||bl.dataset.ans);bl.insertAdjacentHTML("afterend",`<span class="fix" style="display:inline;margin-left:4px">(${bl.dataset.ans})</span>`)}});done(sc,answers.length,missed)})}
function psortPart(body,done){body.style.setProperty("--lc","var(--cp)");const items=shuffle(PSORT).map(([t,k])=>({text:t,bin:k}));
  body.innerHTML=sortHTML(items,[{key:"help",label:"🚀 Helps a toy succeed",c:"var(--ok)"},{key:"sink",label:"💥 Can sink the company",c:"var(--bad)"}]);
  checkBtn(body,"Check my sorting",()=>{const r=gradeSort($(".dnd",body));done(r.score,r.max,r.score<r.max?["unique","fad"]:[])})}
function passagePart(body,done){body.style.setProperty("--lc","var(--cp)");const items=shuffle(PASSAGE).slice(0,12).map(([q,o,w])=>({q,correct:o[0],shuffled:shuffle(o),w}));body.innerHTML=mcHTML(items);wireMC(body,items,done)}
function analogyPart(body,done){const items=shuffle(ANALOG).map(([q,o,w,why])=>({q:`<span class="analogy">${q}</span>`,correct:o[0],shuffled:shuffle(o),w,why}));body.innerHTML=mcHTML(items);wireMC(body,items,done,it=>it.why)}
function showResults(){
  const t=totals();const pc=Math.round(t.s/t.m*100);const best=store.get("ww710-best",null);if(best===null||pc>best)store.set("ww710-best",pc);
  const stars=pc>=95?"⭐⭐⭐⭐⭐":pc>=85?"⭐⭐⭐⭐":pc>=70?"⭐⭐⭐":pc>=55?"⭐⭐":"⭐";
  const msg=pc>=95?"Word champion! You're ready for the test.":pc>=85?"Superb! Just polish the few words below.":pc>=70?"Good progress. Play the games for the words below, then retake.":"Keep going: replay the lesson games for the words below, then try again.";
  const missed=[...new Set(Q.res.flatMap(r=>r.missed))].filter(w=>WORD[w]);drawTrack();
  $("#stage").innerHTML=`<div class="results"><div class="pct">${pc}%</div><div class="stars">${stars}</div><h3 style="font-size:1.6rem">${msg}</h3><p style="color:var(--muted)">${t.s} out of ${t.m} points${best!==null?`. Best before: ${best}%`:""}</p>
  <div class="breakdown">${Q.res.map(r=>`<div><span>${r.title}</span><b>${r.score} / ${r.max}</b></div>`).join("")}</div>
  ${missed.length?`<h3 style="font-size:1.4rem;margin-top:10px">Words to review (${missed.length})</h3><div class="review">${missed.map(w=>{const x=WORD[w];return `<div style="--tc:${x.color}"><b>${x.e} ${x.w}</b> <small style="color:var(--muted)">Lesson ${x.lesson}</small><br>${x.m}</div>`}).join("")}</div>`:`<p style="font-size:1.2rem">No words to review. Every single one is yours! 🎉</p>`}
  <div style="display:flex;gap:12px;justify-content:center;flex-wrap:wrap"><button class="btn big" id="retake">🔁 Retake with new words</button><button class="btn ghost big" id="qhome">Back to start</button></div></div>`;
  $("#retake").onclick=()=>{startQuiz();$("#view-quiz").scrollIntoView({behavior:"smooth"})};$("#qhome").onclick=()=>show("home");
  confetti(pc>=85?2.2:pc>=70?1:0);
}

/* ============================ CONFETTI ============================ */
function confetti(sec){
  if(!sec||reduced())return;
  const cv=$("#confetti"),ctx=cv.getContext("2d");cv.width=innerWidth;cv.height=innerHeight;
  const cols=["#F08A12","#0FA392","#1C7FE0","#E0357A","#8B3FD1","#FFC93C"];
  const ps=Array.from({length:Math.round(120*Math.min(sec,1.5))},()=>({x:Math.random()*cv.width,y:-20-Math.random()*cv.height*.4,vx:(Math.random()-.5)*4,vy:2+Math.random()*4,r:Math.random()*6.28,vr:(Math.random()-.5)*.3,s:6+Math.random()*7,c:cols[Math.random()*cols.length|0]}));
  const end=performance.now()+sec*1000+1800;
  (function f(now){ctx.clearRect(0,0,cv.width,cv.height);ps.forEach(p=>{p.x+=p.vx;p.y+=p.vy;p.vy+=.05;p.r+=p.vr;ctx.save();ctx.translate(p.x,p.y);ctx.rotate(p.r);ctx.fillStyle=p.c;ctx.fillRect(-p.s/2,-p.s/4,p.s,p.s/2);ctx.restore()});if(now<end)requestAnimationFrame(f);else ctx.clearRect(0,0,cv.width,cv.height)})(performance.now());
}

const setNavH=()=>document.documentElement.style.setProperty("--navh",$("nav.tabs").offsetHeight+"px");setNavH();addEventListener("resize",setNavH);
show("home");
</script>
