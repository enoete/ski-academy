<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Adiaha's Word Studio · Wordly Wise Lessons 1–5</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&family=Fredoka:wght@500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#FBF7FF; --card:#FFFFFF; --ink:#27203D; --muted:#6A6286; --line:#E4DAF4;
  --c1:#0FA392; --c2:#5A48D8; --c3:#EE960F; --c4:#1C8EE0; --c5:#E03D7A; --c6:#8B3FD1;
  --ok:#159A5B; --okbg:#DFF6EA; --bad:#DB3A40; --badbg:#FDE6E7;
  --mist:#ffffff; --peak1:#F6C3DA; --peak2:#C8B6F4; --peak3:#8FD3CB;
  --stick:0 3px 0 rgba(39,32,61,.18);
  --display:"Fredoka", "Trebuchet MS", system-ui, sans-serif;
  --body:"Atkinson Hyperlegible", "Segoe UI", system-ui, sans-serif;
  color-scheme:light;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --paper:#16122A; --card:#221C3B; --ink:#F4F0FF; --muted:#B3AACF; --line:#382F5C;
    --c1:#2CC7B4; --c2:#8B7CFF; --c3:#FFB23E; --c4:#4FB0FF; --c5:#FF6A9E; --c6:#B67BFF;
    --ok:#3DD68C; --okbg:#123A29; --bad:#FF6B70; --badbg:#431C25;
    --mist:#16122A; --peak1:#5A2E57; --peak2:#3E3278; --peak3:#1E5A5A;
    --stick:0 3px 0 rgba(0,0,0,.45); color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --paper:#16122A; --card:#221C3B; --ink:#F4F0FF; --muted:#B3AACF; --line:#382F5C;
  --c1:#2CC7B4; --c2:#8B7CFF; --c3:#FFB23E; --c4:#4FB0FF; --c5:#FF6A9E; --c6:#B67BFF;
  --ok:#3DD68C; --okbg:#123A29; --bad:#FF6B70; --badbg:#431C25;
  --mist:#16122A; --peak1:#5A2E57; --peak2:#3E3278; --peak3:#1E5A5A;
  --stick:0 3px 0 rgba(0,0,0,.45); color-scheme:dark;
}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:calc(env(safe-area-inset-top,0px) + 80px)}
body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--body);font-size:17px;line-height:1.55;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit}
h1,h2,h3,h4{font-family:var(--display);line-height:1.15;margin:0}
.wrap{max-width:1040px;margin:0 auto;padding:0 18px}
[hidden]{display:none!important}
:focus-visible{outline:3px solid var(--c4);outline-offset:3px;border-radius:8px}

/* HERO */
.hero{position:relative;overflow:hidden;padding:40px 0 0;min-height:340px}
.hero svg.scape{position:absolute;inset:auto 0 0 0;width:100%;height:260px;display:block}
.hero .wrap{position:relative;z-index:2}
.hero h1{font-size:clamp(2.4rem,7vw,4.4rem);font-weight:700;letter-spacing:-.01em;max-width:12ch}
.hero .brush{display:block;width:min(420px,80%);height:26px;margin:6px 0 10px}
.hero .brush path{fill:none;stroke:var(--c5);stroke-width:9;stroke-linecap:round;stroke-dasharray:520;stroke-dashoffset:520;animation:draw 1.4s .3s ease-out forwards}
.hero p.sub{font-size:1.15rem;max-width:44ch;color:var(--muted);margin:0 0 150px}
@keyframes draw{to{stroke-dashoffset:0}}
.mist{animation:drift 26s ease-in-out infinite alternate}
.mist.b{animation-duration:34s;animation-direction:alternate-reverse}
@keyframes drift{from{transform:translateX(-60px)}to{transform:translateX(60px)}}
.moon{animation:eclipse 3.2s .4s ease-in-out forwards}
@keyframes eclipse{from{transform:translateX(-70px)}to{transform:translateX(-18px)}}

/* NAV */
nav.tabs{position:sticky;top:0;z-index:30;background:color-mix(in srgb,var(--paper) 88%,transparent);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-bottom:2px solid var(--line);padding-top:env(safe-area-inset-top,0px)}
nav.tabs .wrap{display:flex;gap:8px;overflow-x:auto;padding-top:10px;padding-bottom:10px;scrollbar-width:none}
nav.tabs .wrap::-webkit-scrollbar{display:none}
.tab{flex:0 0 auto;border:2px solid var(--line);background:var(--card);border-radius:999px;padding:8px 14px;font-family:var(--display);font-weight:600;font-size:.98rem;cursor:pointer;display:flex;align-items:center;gap:7px;white-space:nowrap}
.tab .dot{width:12px;height:12px;border-radius:50%;background:var(--tc)}
.tab[aria-current="page"]{background:var(--tc);border-color:var(--tc);color:var(--paper);box-shadow:var(--stick)}
.tab[aria-current="page"] .dot{background:var(--paper)}

main{padding:28px 0 60px}

/* HOME */
.intro{display:grid;grid-template-columns:1.2fr 1fr;gap:28px;align-items:start}
.intro h2{font-size:1.9rem;margin-bottom:8px}
.steps{list-style:none;padding:0;margin:16px 0 0;counter-reset:s}
.steps li{counter-increment:s;display:flex;gap:12px;align-items:flex-start;margin:0 0 12px}
.steps li::before{content:counter(s);flex:0 0 32px;height:32px;border-radius:50%;background:var(--ink);color:var(--paper);font-family:var(--display);font-weight:700;display:grid;place-items:center}
.pots{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:14px;margin-top:26px}
.pot{border:0;text-align:left;cursor:pointer;background:var(--card);border-radius:22px 22px 22px 6px;padding:16px 16px 14px;box-shadow:inset 0 0 0 2px var(--line),var(--stick);position:relative;overflow:hidden;transition:transform .15s}
.pot:hover{transform:translateY(-3px)}
.pot::before{content:"";position:absolute;right:-26px;top:-26px;width:92px;height:92px;border-radius:50%;background:var(--tc);opacity:.9}
.pot .n{font-family:var(--display);font-weight:700;font-size:1.9rem;color:#fff;position:absolute;right:12px;top:4px}
.pot h3{font-size:1.15rem;margin:26px 0 4px;max-width:12ch}
.pot small{color:var(--muted);display:block}
.pot .bar{height:8px;background:var(--line);border-radius:9px;margin-top:10px;overflow:hidden}
.pot .bar i{display:block;height:100%;background:var(--tc);border-radius:9px;width:0;transition:width .4s}
.bigquiz{grid-column:1/-1;border-radius:22px;padding:22px;background:var(--ink);color:var(--paper);display:flex;gap:18px;align-items:center;justify-content:space-between;flex-wrap:wrap}
.bigquiz h3{font-size:1.5rem}
.bigquiz p{margin:4px 0 0;opacity:.8;max-width:52ch}

/* BUTTONS */
.btn{border:0;cursor:pointer;background:var(--lc,var(--c2));color:#fff;font-family:var(--display);font-weight:600;font-size:1.02rem;padding:11px 20px;border-radius:14px;box-shadow:var(--stick);transition:transform .1s}
.btn:active{transform:translateY(2px);box-shadow:none}
.btn:disabled{opacity:.4;cursor:not-allowed}
.btn.ghost{background:var(--card);color:var(--ink);box-shadow:inset 0 0 0 2px var(--line)}
.btn.light{background:var(--paper);color:var(--ink)}
.btn.big{font-size:1.15rem;padding:14px 26px}

/* LESSON */
.lhead{display:flex;gap:18px;align-items:center;margin-bottom:10px}
.lnum{flex:0 0 72px;height:72px;border-radius:50% 50% 50% 14%;background:var(--lc);color:#fff;font-family:var(--display);font-weight:700;font-size:2.4rem;display:grid;place-items:center;box-shadow:var(--stick)}
.lhead h2{font-size:clamp(1.6rem,4vw,2.3rem)}
.lhead p{margin:4px 0 0;color:var(--muted);max-width:60ch}
.tools{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin:16px 0}
.mastery{font-family:var(--display);font-weight:600;margin-right:auto}
.mastery b{color:var(--lc)}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:16px}
.card{position:relative;perspective:1100px;cursor:pointer;outline:none;display:grid}
.card .inner{display:grid;transition:transform .55s cubic-bezier(.3,1.3,.5,1);transform-style:preserve-3d;min-height:250px}
.card.flipped .inner{transform:rotateY(180deg)}
.face{grid-area:1/1;backface-visibility:hidden;-webkit-backface-visibility:hidden;border-radius:20px;padding:18px;background:var(--card);box-shadow:inset 0 0 0 2px var(--line),var(--stick)}
.front{display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:4px;border-top:8px solid var(--lc)}
.front .emo{font-size:2.8rem;line-height:1}
.front .word{font-family:var(--display);font-weight:700;font-size:1.7rem}
.front .pos{color:var(--muted);font-style:italic;font-size:.95rem}
.back{transform:rotateY(180deg);font-size:.95rem;background:color-mix(in srgb,var(--lc) 10%,var(--card))}
.back h4{font-size:1.15rem;color:var(--lc);margin-bottom:4px}
.back ol{margin:0 0 8px;padding-left:20px}
.back li{margin-bottom:3px}
.back .forms{font-size:.88rem;color:var(--muted);margin:0 0 6px}
.back .ex{font-style:italic;margin:0 0 6px}
.back .hook{margin:0;padding:8px 10px;border-radius:12px;background:var(--card);font-size:.9rem}
.cbtns{position:absolute;top:8px;right:8px;display:flex;gap:4px;z-index:3}
.icon{border:0;background:var(--card);box-shadow:inset 0 0 0 2px var(--line);width:36px;height:36px;border-radius:50%;cursor:pointer;font-size:1rem;display:grid;place-items:center}
.icon.star[aria-pressed="true"]{background:#FFD23F;box-shadow:inset 0 0 0 2px #E8B400}
.card.known .front{background:color-mix(in srgb,#FFD23F 16%,var(--card))}
h3.game{font-size:1.5rem;margin:40px 0 4px}
p.hint{color:var(--muted);margin:0 0 14px}

/* DRAG & DROP */
.dnd{position:relative;user-select:none;-webkit-user-select:none}
.pool{display:flex;flex-wrap:wrap;gap:10px;padding:14px;border-radius:18px;background:color-mix(in srgb,var(--lc,var(--c2)) 8%,var(--card));min-height:62px;border:2px dashed color-mix(in srgb,var(--lc,var(--c2)) 45%,var(--line))}
.pool:empty::after{content:"All placed ✨";color:var(--muted);font-family:var(--display);padding:6px}
.pool.sticky{position:sticky;top:calc(var(--navh,62px) + 6px);z-index:12;box-shadow:0 8px 18px -10px rgba(0,0,0,.35)}
.chip{display:inline-flex;align-items:center;gap:8px;background:var(--card);border:2px solid var(--ink);border-radius:999px;padding:7px 14px;font-weight:700;cursor:grab;user-select:none;-webkit-user-select:none;box-shadow:var(--stick);touch-action:none;max-width:100%;line-height:1.3}
.chip.long{border-radius:14px;font-weight:400;padding:9px 12px}
.chip:active{cursor:grabbing}
.chip.dragging{opacity:.35}
.chip .x{display:none;border:0;background:var(--ink);color:var(--paper);width:22px;height:22px;border-radius:50%;font-size:.72rem;cursor:pointer;flex:0 0 22px;padding:0}
.drop .chip .x{display:inline-grid;place-items:center}
.locked .chip .x{display:none!important}
.locked .chip{cursor:default}
.chip.ghost{position:fixed;z-index:1000;pointer-events:none;opacity:.95;transform:rotate(-3deg) scale(1.06);box-shadow:0 10px 24px rgba(0,0,0,.25)}
.chip.right{border-color:var(--ok);background:var(--okbg)}
.chip.wrong{border-color:var(--bad);background:var(--badbg)}
.pop{animation:pop .28s ease-out}
@keyframes pop{0%{transform:scale(.8)}60%{transform:scale(1.08)}100%{transform:scale(1)}}
.drop.hi{outline:3px solid var(--lc,var(--c2));outline-offset:2px;background:color-mix(in srgb,var(--lc,var(--c2)) 16%,var(--card))!important}
.bins{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:14px;margin-top:14px}
.bin{border-radius:22px;padding:12px;min-height:170px;background:var(--card);box-shadow:inset 0 0 0 3px var(--bc,var(--line));transition:background .15s}
.binlabel{font-family:var(--display);font-weight:600;font-size:1.2rem;margin:2px 4px 10px;color:var(--bc)}
.binbody{display:flex;flex-direction:column;align-items:flex-start;gap:8px}
.rows{display:grid;gap:10px;margin-top:14px}
.mrow{display:grid;grid-template-columns:minmax(150px,210px) 1fr;gap:12px;align-items:center;background:var(--card);border-radius:16px;padding:8px;box-shadow:inset 0 0 0 2px var(--line)}
.slot{min-height:46px;border-radius:999px;border:2px dashed var(--muted);display:flex;align-items:center;justify-content:center;padding:3px}
.slot.filled{border-style:solid;border-color:transparent}
.mdef{padding-right:6px}
.fix{display:block;font-size:.85rem;color:var(--ok);font-weight:700;margin-top:2px}
.blank{display:inline-flex;min-width:120px;min-height:40px;vertical-align:middle;border-bottom:3px solid var(--lc,var(--c2));border-radius:10px 10px 0 0;margin:3px 2px;padding:2px;justify-content:center;align-items:center;background:color-mix(in srgb,var(--lc,var(--c2)) 7%,transparent)}
.storytext{background:var(--card);border-radius:20px;padding:20px;box-shadow:inset 0 0 0 2px var(--line);line-height:2.3;font-size:1.05rem}
.seq{display:grid;gap:10px;margin-top:12px;counter-reset:q}
.seqrow{display:flex;gap:10px;align-items:center}
.seqrow b{flex:0 0 38px;height:38px;border-radius:50%;background:var(--lc,var(--c2));color:#fff;display:grid;place-items:center;font-family:var(--display)}
.seqrow .drop{flex:1;min-height:50px;border-radius:14px;border:2px dashed var(--muted);padding:4px;display:flex;align-items:center}
.seqrow .drop.filled{border-style:solid;border-color:var(--line)}

/* STORY */
.scroll{position:relative;margin-top:20px;display:grid;gap:18px}
.scene{display:grid;grid-template-columns:90px 1fr;gap:18px;background:var(--card);border-radius:24px;padding:20px;box-shadow:inset 0 0 0 2px var(--line),var(--stick)}
.scene .art{font-size:3rem;text-align:center;line-height:1.1}
.scene .art small{display:block;font-family:var(--display);font-size:.8rem;color:var(--muted);margin-top:6px}
.scene h3{font-size:1.35rem;margin-bottom:6px}
.scene p{margin:0;max-width:66ch}
.vw{border:0;background:color-mix(in srgb,var(--c5) 16%,transparent);color:inherit;font-weight:700;padding:0 5px;border-radius:7px;cursor:pointer;border-bottom:3px solid var(--c5)}
.vw.found{background:var(--c5);color:#fff}
.hunt{position:sticky;top:calc(var(--navh,62px) + 6px);z-index:10;display:flex;gap:12px;align-items:center;background:var(--ink);color:var(--paper);border-radius:16px;padding:10px 16px;font-family:var(--display);font-weight:600;flex-wrap:wrap}
.hunt .meter{flex:1;min-width:120px;height:10px;background:rgba(255,255,255,.2);border-radius:9px;overflow:hidden}
.hunt .meter i{display:block;height:100%;width:0;background:var(--c5);transition:width .3s}
#pop{position:absolute;z-index:50;max-width:300px;background:var(--ink);color:var(--paper);padding:12px 14px;border-radius:14px;font-size:.95rem;box-shadow:0 10px 30px rgba(0,0,0,.3)}
#pop b{font-family:var(--display);font-size:1.1rem;color:#FFD23F;display:block}
.facts{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-top:20px}
.fact{background:var(--card);border-radius:18px;padding:14px;box-shadow:inset 0 0 0 2px var(--line)}
.fact b{font-family:var(--display);font-size:1.8rem;color:var(--c5);display:block;line-height:1}

/* QUIZ */
.qtop{display:flex;justify-content:space-between;align-items:center;gap:14px;flex-wrap:wrap;margin-bottom:12px}
.track{display:flex;gap:6px;flex-wrap:wrap}
.track span{width:26px;height:10px;border-radius:9px;background:var(--line)}
.track span.now{background:var(--ink)}
.track span.good{background:var(--ok)}
.track span.meh{background:var(--c3)}
.track span.low{background:var(--bad)}
.total{font-family:var(--display);font-weight:700;font-size:1.2rem}
.phead{display:flex;gap:14px;align-items:center;background:var(--ink);color:var(--paper);border-radius:22px;padding:16px 18px;margin-bottom:16px}
.phead .pemo{font-size:2.4rem}
.phead h3{font-size:1.45rem}
.phead p{margin:2px 0 0;opacity:.85}
.pfoot{display:flex;justify-content:space-between;gap:12px;align-items:center;margin-top:20px;flex-wrap:wrap}
.pfoot .msg{font-family:var(--display);font-weight:600;font-size:1.15rem}
.q{background:var(--card);border-radius:20px;padding:16px 18px;margin-bottom:14px;box-shadow:inset 0 0 0 2px var(--line)}
.q .qt{font-weight:700;margin:0 0 10px;font-size:1.05rem}
.q .qt .num{display:inline-grid;place-items:center;width:28px;height:28px;border-radius:50%;background:var(--lc,var(--c2));color:#fff;font-family:var(--display);margin-right:8px;font-size:.9rem}
.opts{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:8px}
.opt{text-align:left;border:0;cursor:pointer;background:var(--paper);border-radius:14px;padding:10px 14px;box-shadow:inset 0 0 0 2px var(--line);transition:transform .1s}
.opt:hover:not(:disabled){transform:translateY(-2px);box-shadow:inset 0 0 0 2px var(--lc,var(--c2))}
.opt:disabled{cursor:default}
.opt.sel{box-shadow:inset 0 0 0 3px var(--lc,var(--c2));background:color-mix(in srgb,var(--lc,var(--c2)) 12%,var(--card))}
.opt.right{background:var(--okbg);box-shadow:inset 0 0 0 3px var(--ok)}
.opt.wrong{background:var(--badbg);box-shadow:inset 0 0 0 3px var(--bad)}
.opt.missed{box-shadow:inset 0 0 0 3px var(--ok)}
.tf{display:flex;gap:10px}
.stamp{flex:1;border:0;cursor:pointer;font-family:var(--display);font-weight:700;font-size:1.2rem;padding:12px;border-radius:16px;background:var(--paper);box-shadow:inset 0 0 0 3px var(--line);transform:rotate(-1deg)}
.stamp.f{transform:rotate(1deg)}
.stamp:hover:not(:disabled){box-shadow:inset 0 0 0 3px var(--ink)}
.stamp.right{background:var(--okbg);box-shadow:inset 0 0 0 3px var(--ok)}
.stamp.wrong{background:var(--badbg);box-shadow:inset 0 0 0 3px var(--bad)}
.why{margin:10px 0 0;padding:10px 12px;border-radius:12px;font-size:.95rem}
.why.good{background:var(--okbg)}
.why.bad{background:var(--badbg)}
.bold{font-weight:700;color:var(--lc,var(--c2))}
.analogy{font-family:var(--display);font-weight:700;font-size:1.3rem;letter-spacing:.02em}
.results{text-align:center;padding:10px 0}
.results .pct{font-family:var(--display);font-weight:700;font-size:clamp(3.5rem,14vw,6rem);line-height:1}
.results .stars{font-size:2.4rem;margin:6px 0}
.breakdown{display:grid;gap:6px;max-width:560px;margin:22px auto;text-align:left}
.breakdown div{display:flex;justify-content:space-between;background:var(--card);padding:8px 14px;border-radius:12px;box-shadow:inset 0 0 0 2px var(--line)}
.review{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:10px;text-align:left;margin:14px 0 24px}
.review div{background:var(--card);border-radius:14px;padding:10px 12px;box-shadow:inset 0 0 0 2px var(--line);border-left:6px solid var(--tc)}
.review b{font-family:var(--display);font-size:1.1rem}
#confetti{position:fixed;inset:0;pointer-events:none;z-index:999}
footer{color:var(--muted);text-align:center;font-size:.9rem;padding:20px 0 40px}
.themebtn{position:absolute;top:14px;right:14px;z-index:5}

@media (max-width:720px){
  .intro{grid-template-columns:1fr}
  .mrow{grid-template-columns:1fr}
  .scene{grid-template-columns:1fr}
  .scene .art{text-align:left;display:flex;gap:10px;align-items:center}
  .scene .art small{margin:0}
  .hero p.sub{margin-bottom:130px}
  body{font-size:16px}
}
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation:none!important;transition:none!important}
  .hero .brush path{stroke-dashoffset:0}
  .moon{transform:translateX(-18px)}
}
</style>
</head>
<body>

<header class="hero">
  <button class="icon themebtn" id="themeBtn" aria-label="Switch light or dark">🌓</button>
  <div class="wrap">
    <h1>Adiaha's Word Studio</h1>
    <svg class="brush" viewBox="0 0 420 26" aria-hidden="true"><path d="M6 17 C 80 5, 160 22, 240 12 S 380 8, 414 14"/></svg>
    <p class="sub">Wordly Wise Book 6, Lessons 1 to 5: all 75 words, the story of Wang Yani, and one big quiz to prove you've got them.</p>
  </div>
  <svg class="scape" viewBox="0 0 1200 260" preserveAspectRatio="xMidYMax slice" aria-hidden="true">
    <circle cx="930" cy="70" r="46" fill="#FFC23D"/>
    <circle class="moon" cx="930" cy="70" r="44" fill="var(--paper)"/>
    <path id="p1" fill="var(--peak2)"/>
    <rect class="mist" x="-100" y="150" width="1400" height="26" rx="13" fill="var(--mist)" opacity=".7"/>
    <path id="p2" fill="var(--peak1)"/>
    <rect class="mist b" x="-100" y="200" width="1400" height="22" rx="11" fill="var(--mist)" opacity=".75"/>
    <path id="p3" fill="var(--peak3)"/>

/* ============================ DRAG & DROP ENGINE ============================ */
function chipHTML(text,data,poolId,long){
  const attrs=Object.entries(data).map(([k,v])=>`data-${k}="${esc(v)}"`).join(" ");
  return `<div class="chip${long?" long":""}" draggable="true" data-pool="${poolId}" ${attrs}><span>${text}</span><button class="x" aria-label="Send back">✕</button></div>`;
}
function sortHTML(items,bins){
  const id=uid();
  return `<div class="dnd" id="${id}"><div class="pool" id="${id}-pool">${items.map(it=>chipHTML(it.text,{bin:it.bin,w:it.w||""},id+"-pool",true)).join("")}</div>
  <div class="bins">${bins.map(b=>`<div class="drop many bin" data-bin="${b.key}" style="--bc:${b.c}"><div class="binlabel">${b.label}</div><div class="binbody"></div></div>`).join("")}</div></div>`;
}
function gradeSort(game){
  game.classList.add("locked");let score=0;const chips=$$(".chip",game);const missed=[];
  chips.forEach(c=>{const bin=c.closest(".bin");const ok=bin&&bin.dataset.bin===c.dataset.bin;c.classList.add(ok?"right":"wrong");if(ok)score++;else if(c.dataset.w)missed.push(...c.dataset.w.split(","))});
  return {score,max:chips.length,missed};
}
let drag=null,ghost=null,hiEl=null;
function setHi(d){if(hiEl&&hiEl!==d)hiEl.classList.remove("hi");hiEl=d;if(d)d.classList.add("hi")}
function dropFor(el,chip){if(!el||!el.closest||!chip)return null;const d=el.closest(".drop");if(!d)return null;if(d.closest(".dnd")!==chip.closest(".dnd"))return null;if(d.closest(".locked"))return null;return d}
function refresh(game){$$(".drop.one",game).forEach(d=>d.classList.toggle("filled",!!d.querySelector(".chip")))}
function sendBack(chip){const p=document.getElementById(chip.dataset.pool);if(p){p.appendChild(chip);pop(chip);refresh(chip.closest(".dnd"))}}
function pop(el){el.classList.remove("pop");void el.offsetWidth;el.classList.add("pop")}
function place(chip,d){
  const body=d.querySelector(".binbody")||d;
  if(d.classList.contains("one")){const ex=body.querySelector(".chip");if(ex&&ex!==chip)sendBack(ex)}
  body.appendChild(chip);pop(chip);refresh(d.closest(".dnd"));
}
document.addEventListener("dragstart",e=>{const c=e.target.closest&&e.target.closest(".chip");if(!c)return;if(ghost||c.closest(".locked")){e.preventDefault();return}drag=c;c.classList.add("dragging");try{e.dataTransfer.setData("text/plain",c.textContent);e.dataTransfer.effectAllowed="move"}catch(_){}});
document.addEventListener("dragend",()=>{if(drag&&!ghost){drag.classList.remove("dragging");drag=null}setHi(null)});
document.addEventListener("dragover",e=>{if(!drag||ghost)return;const d=dropFor(e.target,drag);if(d){e.preventDefault();setHi(d)}else setHi(null)});
document.addEventListener("drop",e=>{if(!drag||ghost)return;const d=dropFor(e.target,drag);if(d){e.preventDefault();place(drag,d)}setHi(null)});
function moveGhost(t){ghost.style.left=(t.clientX-ghost._dx)+"px";ghost.style.top=(t.clientY-ghost._dy)+"px"}
document.addEventListener("touchstart",e=>{
  const c=e.target.closest&&e.target.closest(".chip");if(!c||e.target.closest(".x")||c.closest(".locked")||e.touches.length>1)return;
  const t=e.touches[0],r=c.getBoundingClientRect();drag=c;
  ghost=c.cloneNode(true);ghost.classList.add("ghost");ghost.classList.remove("pop");ghost.style.width=r.width+"px";ghost._dx=t.clientX-r.left;ghost._dy=t.clientY-r.top;
  document.body.appendChild(ghost);moveGhost(t);c.classList.add("dragging");
},{passive:true});
document.addEventListener("touchmove",e=>{
  if(!ghost)return;e.preventDefault();const t=e.touches[0];moveGhost(t);
  setHi(dropFor(document.elementFromPoint(t.clientX,t.clientY),drag));
  if(t.clientY<90)window.scrollBy(0,-14);else if(t.clientY>innerHeight-90)window.scrollBy(0,14);
},{passive:false});
function endTouch(e,cancel){if(!ghost)return;const t=e.changedTouches[0];const d=cancel?null:dropFor(document.elementFromPoint(t.clientX,t.clientY),drag);ghost.remove();ghost=null;drag.classList.remove("dragging");if(d)place(drag,d);drag=null;setHi(null)}
document.addEventListener("touchend",e=>endTouch(e,false));
document.addEventListener("touchcancel",e=>endTouch(e,true));
document.addEventListener("click",e=>{const x=e.target.closest(".x");if(!x)return;const c=x.closest(".chip");if(c&&!c.closest(".locked")){e.stopPropagation();sendBack(c)}});

 ["The shelter made an <b>appeal</b> for warm blankets.",["an earnest request for help","the power to attract","a type of fruit peel","a public show"],"appeal"],
 ["Gentle fog <b>shrouded</b> the mountain peaks.",["blocked from sight","wrapped for burial","made brighter","blew away"],"shroud"]
];
const SELECT=[
 ["Which of these could be <b>inflated</b>?",[["a balloon",1],["a bicycle tire",1],["a brick",0],["a raft",1]],"inflate"],
 ["Which of these would be <b>conspicuous</b>?",[["a lighthouse on a cliff",1],["a pebble on a beach",0],["a neon-green car in a parking lot",1],["a whisper in a loud stadium",0]],"conspicuous"],
 ["Which of these could <b>graze</b>? (Careful: two meanings!)",[["a herd of cows",1],["a shark",0],["a snowball brushing your cheek",1],["sheep in a field",1]],"graze"],
 ["Which of these could be <b>exhibited</b>?",[["paintings",1],["ancient coins",1],["next Tuesday",0],["dinosaur bones",1]],"exhibit"],
 ["Which of these could be <b>tranquil</b>?",[["a lake at sunrise",1],["a hectic airport",0],["a quiet garden",1],["a fire alarm going off",0]],"tranquil"],

const STORIES=[
 {title:"The Steel Pan Festival",text:"The night of the steel pan festival was completely [hectic]: [hordes] of people squeezed into the square, and the air was so [humid] that everyone's shirts stuck to their backs. Marisol's band had practiced [diligently] for months. When they walked on stage in matching gold [attire], the crowd went quiet. Their leader, a [versatile] musician who could play pan, trumpet, and drums, gave the signal. From the first note, the music [captivated] everyone. When the judges announced their [verdict] (first place!), it was a total [triumph].",decoys:["tranquil","arid"]},
 {title:"The Kite Contest",text:"Dev's kite shot [aloft] on the very first gust. It [hovered] for a moment above the field, then suddenly [plummeted] toward a tree! With one [deft] flick of his wrist, he swooped it back up. The wind [buffeted] it from every side, but it stayed up. Finally it [attained] the greatest height of any kite that day, and Dev's grin was so [conspicuous] you could see it from across the park.",decoys:["moored","inflated","stationary"]}
];
const BASE={diligently:"diligent",hordes:"horde",hovered:"hover",plummeted:"plummet",buffeted:"buffet",attained:"attain",captivated:"captivate"};
const LIFE=["Starts painting at age two","Holds her first exhibition in China at age four","Paintings shown at the Smithsonian at age fourteen","Has painted more than 10,000 pictures by sixteen","Keeps painting and changing as an adult"];
const METHOD=["Spills ink onto the paper (po-mo)","Makes a few tentative strokes","Works quickly until the painting is finished"];
const PASSAGE=[
 ["Yani's father thought lessons would <b>stifle</b> her imagination. Here, stifle means…",["hold it back","cut off its air","make it stronger","paint over it"],"stifle"],
 ["\"Yani's fame soon <b>eclipsed</b> her father's fame\" means…",["her fame became greater than his","her fame hid behind the moon","her fame faded quickly","her fame was equal to his"],"eclipse"],
 ["The monkeys were painted in different <b>postures</b>. Postures are…",["body positions or poses","places in a zoo","colors of fur","kinds of monkeys"],"posture"],
 ["The Guilin mountains are often <b>shrouded</b> in mist. They are…",["covered and hidden","made brighter","wrapped for burial","blown away"],"shroud"],
 ["Why might Yani's first strokes be <b>tentative</b>?",["She's still feeling out what the painting will become","She's scared of the audience","Her brush is broken","Her father told her to paint slowly"],"tentative"],

 ["Why was painting such a short job for Yani, often under half an hour?",["After a few careful strokes she works rapidly and with total focus","She uses a computer","Her father helps her finish","She only paints tiny pictures"],"deft"]
];
const ANALOG=[
 ["HUMID : ARID ::",["wet : dry","hungry : thirsty","big : large","hot : warm"],"humid","Humid and arid are opposites, just like wet and dry."],
 ["SPLENDID : SQUALID ::",["attractive : ugly","loud : noisy","tall : lofty","fast : quick"],"squalor","Splendid and squalid are opposites."],
 ["INTEGRATE : SEGREGATE ::",["join : separate","build : make","shout : yell","sit : chair"],"integrate","Opposites: bring together vs. keep apart."],
 ["DEFT : SKILLFUL ::",["tranquil : calm","hectic : calm","tall : short","arid : wet"],"deft","Synonyms: deft means skillful, tranquil means calm."],
 ["TRIUMPH : DEFEAT ::",["success : failure","win : victory","joy : happiness","game : sport"],"triumph","Opposites: a triumph is a success, the opposite of a defeat."],

];

/* ============================ QUIZ ENGINE ============================ */
const Q={parts:[],i:0,res:[]};
function mcHTML(items,opts){
  return items.map((it,qi)=>`<div class="q" data-qi="${qi}"><p class="qt"><span class="num">${qi+1}</span>${it.q}</p><div class="opts">${it.shuffled.map(o=>`<button class="opt" data-ok="${o===it.correct?1:0}">${o}</button>`).join("")}</div></div>`).join("");
}
function wireMC(body,items,done,whyFn){
  let answered=0,score=0;const missed=[];
  body.addEventListener("click",e=>{
    const b=e.target.closest(".opt");if(!b||b.disabled)return;const q=b.closest(".q");const it=items[+q.dataset.qi];
    $$(".opt",q).forEach(o=>{o.disabled=true;if(o.dataset.ok==="1")o.classList.add(o===b?"right":"missed")});
    const ok=b.dataset.ok==="1";if(!ok){b.classList.add("wrong");missed.push(it.w)}else score++;
    const why=whyFn?whyFn(it,ok):(ok?"Yes!":`The answer is “${it.correct}”.`);
    q.insertAdjacentHTML("beforeend",`<p class="why ${ok?"good":"bad"}">${ok?"✅ ":"❌ "}${why}</p>`);
    if(++answered===items.length)done(score,items.length,missed);
  });
}
function buildParts(){
  const pick=shuffle(LESSONS.flatMap(L=>shuffle(L.words).slice(0,5))).slice(0,24);
  const parts=[];
  [0,1,2].forEach(r=>{const words=pick.slice(r*8,r*8+8);parts.push({emoji:"🧩",title:`Match Madness, round ${r+1}`,intro:"Drag each word onto its meaning.",render:(b,d)=>matchPart(b,d,words)})});
  parts.push({emoji:"⚖️",title:"Twins or opposites?",intro:"Synonyms mean the same. Antonyms mean the opposite. Sort each pair.",render:synAntPart});
  parts.push({emoji:"✅",title:"True or false",intro:"Stamp each statement. Watch for sneaky ones!",render:tfPart});
  parts.push({emoji:"🔤",title:"Which word fits?",intro:"Pick the word that makes the sentence make sense.",render:fitPart});
  parts.push({emoji:"🎭",title:"Same word, different meaning",intro:"These words have more than one meaning. Which one is used here?",render:meanPart});
  parts.push({emoji:"☑️",title:"Pick ALL that apply",intro:"There may be more than one right answer. Choose every one, then check.",render:selectPart});
  STORIES.forEach(s=>parts.push({emoji:"📖",title:`Story fill: ${s.title}`,intro:"Drag the words into the blanks. Some extra words don't belong anywhere!",render:(b,d)=>storyPart(b,d,s)}));
  parts.push({emoji:"🗓️",title:"Yani's timeline",intro:"Put Yani's life and her painting method in the right order.",render:orderPart});
  parts.push({emoji:"🐒",title:"Questions about A Born Artist",intro:"All about passage 5E.",render:passagePart});
  parts.push({emoji:"🔗",title:"Analogy puzzles",intro:"Find the pair that has the same relationship as the capital-letter pair.",render:analogyPart});
  return parts;
}
function renderQuizIntro(){
  const v=$("#view-quiz");v.style.setProperty("--lc","var(--c2)");
  v.innerHTML=`<div class="lhead"><div class="lnum" style="background:var(--ink);color:var(--paper)">🏆</div><div><h2>The Big Quiz</h2><p>13 rounds covering all 75 words and passage 5E. You'll get feedback as you go. Aim for 90% or higher!</p></div></div>
  <div class="qtop"><div class="track" id="track"></div><div class="total" id="total"></div></div>
  <div id="stage"></div>`;
  startQuiz();
}
function startQuiz(){Q.parts=buildParts();Q.i=0;Q.res=[];renderPart()}
function totals(){let s=0,m=0;Q.res.forEach(r=>{if(r){s+=r.score;m+=r.max}});return {s,m}}
function drawTrack(){
  $("#track").innerHTML=Q.parts.map((p,i)=>{const r=Q.res[i];let c="";if(r){const pc=r.score/r.max;c=pc>=.85?"good":pc>=.6?"meh":"low"}else if(i===Q.i)c="now";return `<span class="${c}" title="${esc(p.title)}"></span>`}).join("");
  const t=totals();$("#total").textContent=`Score: ${t.s} / ${t.m}`;
}
function renderPart(){
  const p=Q.parts[Q.i];const stage=$("#stage");
  stage.innerHTML=`<div class="phead"><span class="pemo">${p.emoji}</span><div><h3>Round ${Q.i+1} of ${Q.parts.length}: ${p.title}</h3><p>${p.intro}</p></div></div><div id="pbody"></div><div class="pfoot"><span class="msg" id="pmsg"></span><button class="btn big" id="nextBtn" disabled>${Q.i===Q.parts.length-1?"See my results":"Next round"}</button></div>`;
  drawTrack();
  p.render($("#pbody"),(score,max,missed)=>{
    Q.res[Q.i]={title:p.title,score,max,missed:missed||[]};drawTrack();
    const pc=score/max;$("#pmsg").textContent=`${score} / ${max} ${pc===1?"· Flawless! 🌟":pc>=.8?"· Great work! 💪":pc>=.6?"· Not bad, keep going!":"· Review these words later 💡"}`;
    const nb=$("#nextBtn");nb.disabled=false;nb.focus({preventScroll:true});
    if(pc===1)confetti(.6);
  });
  $("#nextBtn").onclick=()=>{Q.i++;if(Q.i>=Q.parts.length)showResults();else{renderPart();$("#view-quiz").scrollIntoView({behavior:"smooth"})}};
}
function checkBtn(body,label,fn){const w=document.createElement("div");w.style.cssText="margin-top:14px;display:flex;justify-content:flex-end";w.innerHTML=`<button class="btn">${label}</button>`;body.appendChild(w);const b=$(".btn",w);b.onclick=()=>{b.disabled=true;fn()};return b}

function matchPart(body,done,words){
  const id=uid();
  body.innerHTML=`<div class="dnd" id="${id}"><div class="pool sticky" id="${id}-pool">${shuffle(words).map(w=>chipHTML(w.w,{val:w.w},id+"-pool")).join("")}</div>
  <div class="rows">${shuffle(words).map(w=>`<div class="mrow"><div class="drop one slot" data-ans="${w.w}"></div><div class="mdef">${w.m}</div></div>`).join("")}</div></div>`;
  checkBtn(body,"Check my matches",()=>{
    const g=$("#"+id);g.classList.add("locked");let s=0;const missed=[];
    $$(".slot",g).forEach(sl=>{const c=sl.querySelector(".chip");const ok=c&&c.dataset.val===sl.dataset.ans;if(c)c.classList.add(ok?"right":"wrong");if(ok)s++;else{missed.push(sl.dataset.ans);sl.nextElementSibling.insertAdjacentHTML("beforeend",`<span class="fix">✓ ${sl.dataset.ans}</span>`)}});
    $$(`#${id}-pool .chip`).forEach(c=>c.classList.add("wrong"));
    done(s,words.length,missed);
  });
}
function synAntPart(body,done){
  const items=shuffle(SYNANT).map(([a,b,k])=>({text:`${a} ↔ ${b}`,bin:k,w:WORD[a]?a:b}));
  body.innerHTML=sortHTML(items,[{key:"S",label:"👯 Synonyms (same)",c:"var(--c1)"},{key:"A",label:"🙃 Antonyms (opposite)",c:"var(--c5)"}]);
  checkBtn(body,"Check my sorting",()=>{const r=gradeSort($(".dnd",body));done(r.score,r.max,r.missed)});
}
function tfPart(body,done){
  const items=shuffle(TF);let answered=0,score=0;const missed=[];
  body.innerHTML=items.map(([s],i)=>`<div class="q" data-i="${i}"><p class="qt"><span class="num">${i+1}</span>${s}</p><div class="tf"><button class="stamp" data-v="1">👍 True</button><button class="stamp f" data-v="0">👎 False</button></div></div>`).join("");
  body.addEventListener("click",e=>{const b=e.target.closest(".stamp");if(!b||b.disabled)return;const q=b.closest(".q");const [,ans,why,w]=items[+q.dataset.i];
    $$(".stamp",q).forEach(x=>x.disabled=true);const ok=(b.dataset.v==="1")===ans;b.classList.add(ok?"right":"wrong");if(ok)score++;else missed.push(w);
    q.insertAdjacentHTML("beforeend",`<p class="why ${ok?"good":"bad"}">${ok?"✅ Right!":"❌ It's "+(ans?"TRUE":"FALSE")+"."} ${why}</p>`);
    if(++answered===items.length)done(score,items.length,missed)});
}
function fitPart(body,done){
  const items=shuffle(FIT).map(([s,o])=>({q:s.replace("____",'<span class="bold">_______</span>'),correct:o[0],shuffled:shuffle(o),w:BASE[o[0]]||(WORD[o[0]]?o[0]:guessBase(o[0])),raw:s}));
  body.innerHTML=mcHTML(items);
  wireMC(body,items,done,(it,ok)=>`“${it.raw.replace("____","<b>"+it.correct+"</b>")}”`);
}
function guessBase(form){for(const w of Object.keys(WORD)){if(form.startsWith(w.slice(0,Math.max(4,w.length-2))))return w}return form}
function meanPart(body,done){
  const items=shuffle(MEAN).map(([s,o,w])=>({q:s,correct:o[0],shuffled:shuffle(o),w}));
  body.innerHTML=mcHTML(items);wireMC(body,items,done,(it,ok)=>ok?`Yes, here it means “${it.correct}.”`:`Here it means “${it.correct}.”`);
}
function selectPart(body,done){
  const items=shuffle(SELECT);let checked=0,score=0;const missed=[];
  body.innerHTML=items.map(([q,o],i)=>`<div class="q" data-i="${i}"><p class="qt"><span class="num">${i+1}</span>${q}</p><div class="opts">${shuffle(o).map(([t,ok])=>`<button class="opt" data-ok="${ok}" aria-pressed="false">${t}</button>`).join("")}</div><div style="margin-top:10px"><button class="btn ghost chk">Check</button></div></div>`).join("");
  body.addEventListener("click",e=>{
    const o=e.target.closest(".opt");if(o&&!o.disabled){o.classList.toggle("sel");o.setAttribute("aria-pressed",o.classList.contains("sel"));return}
    const c=e.target.closest(".chk");if(!c)return;const q=c.closest(".q");c.remove();
    let ok=true;$$(".opt",q).forEach(x=>{x.disabled=true;const want=x.dataset.ok==="1",got=x.classList.contains("sel");x.classList.remove("sel");if(want&&got)x.classList.add("right");else if(!want&&got){x.classList.add("wrong");ok=false}else if(want&&!got){x.classList.add("missed");ok=false}});
    if(ok)score++;else missed.push(items[+q.dataset.i][2]);
    q.insertAdjacentHTML("beforeend",`<p class="why ${ok?"good":"bad"}">${ok?"✅ You got every one!":"❌ Not quite. Green outlines show every right answer."}</p>`);
    if(++checked===items.length)done(score,items.length,missed);
  });
}
function storyPart(body,done,s){
  const id=uid();const answers=[...s.text.matchAll(/\[([^\]]+)\]/g)].map(m=>m[1]);
  const chips=shuffle([...answers,...s.decoys]);
  body.innerHTML=`<div class="dnd" id="${id}"><div class="pool sticky" id="${id}-pool">${chips.map(c=>chipHTML(c,{val:c},id+"-pool")).join("")}</div>
  <div class="storytext" style="margin-top:14px"><h4 style="font-size:1.3rem;margin-bottom:6px">${s.title}</h4>${s.text.replace(/\[([^\]]+)\]/g,(m,a)=>`<span class="drop one blank" data-ans="${a}"></span>`)}</div></div>`;
  checkBtn(body,"Check my story",()=>{
    const g=$("#"+id);g.classList.add("locked");let sc=0;const missed=[];
    $$(".blank",g).forEach(bl=>{const c=bl.querySelector(".chip");const ok=c&&c.dataset.val===bl.dataset.ans;if(c)c.classList.add(ok?"right":"wrong");if(ok)sc++;else{missed.push(BASE[bl.dataset.ans]||bl.dataset.ans);bl.insertAdjacentHTML("afterend",`<span class="fix" style="display:inline;margin-left:4px">(${bl.dataset.ans})</span>`)}});
    done(sc,answers.length,missed);
  });
}
function orderPart(body,done){
  const mk=(list,title)=>{const id=uid();return {id,html:`<h4 style="font-size:1.25rem;margin:18px 0 8px">${title}</h4><div class="dnd" id="${id}"><div class="pool" id="${id}-pool">${shuffle(list).map(t=>chipHTML(t,{val:t},id+"-pool",true)).join("")}</div><div class="seq">${list.map((t,i)=>`<div class="seqrow"><b>${i+1}</b><div class="drop one" data-ans="${esc(t)}"></div></div>`).join("")}</div></div>`}};
  const a=mk(LIFE,"🌱 Yani's life, first to last"),b=mk(METHOD,"🖌️ How she paints a picture, first to last");
  body.innerHTML=a.html+b.html;
  checkBtn(body,"Check my order",()=>{let s=0;[a,b].forEach(x=>{const g=$("#"+x.id);g.classList.add("locked");$$(".seqrow .drop",g).forEach(d=>{const c=d.querySelector(".chip");const ok=c&&c.dataset.val===d.dataset.ans;if(c)c.classList.add(ok?"right":"wrong");if(ok)s++;else d.insertAdjacentHTML("beforeend",`<span class="fix" style="margin-left:8px">✓ ${d.dataset.ans}</span>`)})});
    done(s,LIFE.length+METHOD.length,s<8?["diligent"]:[])});
}
function passagePart(body,done){
  const items=shuffle(PASSAGE).map(([q,o,w])=>({q,correct:o[0],shuffled:shuffle(o),w}));
  body.innerHTML=mcHTML(items);wireMC(body,items,done);
}
function analogyPart(body,done){
  const items=shuffle(ANALOG).map(([q,o,w,why])=>({q:`<span class="analogy">${q}</span>`,correct:o[0],shuffled:shuffle(o),w,why}));
  body.innerHTML=mcHTML(items);wireMC(body,items,done,(it)=>it.why);
}
function showResults(){
  const t=totals();const pc=Math.round(t.s/t.m*100);
  const best=store.get("ww15-best",null);if(best===null||pc>best)store.set("ww15-best",pc);
  const stars=pc>=95?"⭐⭐⭐⭐⭐":pc>=85?"⭐⭐⭐⭐":pc>=70?"⭐⭐⭐":pc>=55?"⭐⭐":"⭐";
  const msg=pc>=95?"Word wizard! You're ready for Friday.":pc>=85?"Superb! Just polish the few words below.":pc>=70?"Good progress. Review the words below and retake.":"Keep going: flip the cards for the words below, then try again.";
  const missed=[...new Set(Q.res.flatMap(r=>r.missed))].filter(w=>WORD[w]);
  drawTrack();
  $("#stage").innerHTML=`<div class="results"><div class="pct">${pc}%</div><div class="stars">${stars}</div><h3 style="font-size:1.6rem">${msg}</h3><p style="color:var(--muted)">${t.s} out of ${t.m} points${best!==null?` · best before: ${best}%`:""}</p>
  <div class="breakdown">${Q.res.map(r=>`<div><span>${r.title}</span><b>${r.score} / ${r.max}</b></div>`).join("")}</div>
  ${missed.length?`<h3 style="font-size:1.4rem;margin-top:10px">Words to review (${missed.length})</h3><div class="review">${missed.map(w=>{const x=WORD[w];return `<div style="--tc:${x.color}"><b>${x.e} ${x.w}</b> <small style="color:var(--muted)">Lesson ${x.lesson}</small><br>${x.m}</div>`}).join("")}</div>`:`<p style="font-size:1.2rem">No words to review. Every single one is yours! 🎉</p>`}
  <div style="display:flex;gap:12px;justify-content:center;flex-wrap:wrap"><button class="btn big" id="retake">🔁 Retake with new words</button><button class="btn ghost big" id="home">Back to the studio</button></div></div>`;
  $("#retake").onclick=()=>{startQuiz();$("#view-quiz").scrollIntoView({behavior:"smooth"})};
  $("#home").onclick=()=>show("home");
  confetti(pc>=85?2.2:pc>=70?1:0);
}

/* ============================ CONFETTI ============================ */
function confetti(sec){
  if(!sec||matchMedia("(prefers-reduced-motion: reduce)").matches)return;
  const cv=$("#confetti"),ctx=cv.getContext("2d");cv.width=innerWidth;cv.height=innerHeight;
  const cols=["#0FA392","#5A48D8","#EE960F","#1C8EE0","#E03D7A","#FFD23F"];
  const ps=Array.from({length:Math.round(120*Math.min(sec,1.5))},()=>({x:Math.random()*cv.width,y:-20-Math.random()*cv.height*.4,vx:(Math.random()-.5)*4,vy:2+Math.random()*4,r:Math.random()*6.28,vr:(Math.random()-.5)*.3,s:6+Math.random()*7,c:cols[Math.random()*cols.length|0]}));
  const end=performance.now()+sec*1000+1800;
  (function f(now){ctx.clearRect(0,0,cv.width,cv.height);ps.forEach(p=>{p.x+=p.vx;p.y+=p.vy;p.vy+=.05;p.r+=p.vr;ctx.save();ctx.translate(p.x,p.y);ctx.rotate(p.r);ctx.fillStyle=p.c;ctx.fillRect(-p.s/2,-p.s/4,p.s,p.s/2);ctx.restore()});if(now<end)requestAnimationFrame(f);else ctx.clearRect(0,0,cv.width,cv.height)})(performance.now());
}

const setNavH=()=>document.documentElement.style.setProperty("--navh",$("nav.tabs").offsetHeight+"px");setNavH();addEventListener("resize",setNavH);
show("home");
</script>
